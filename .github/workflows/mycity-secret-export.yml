name: mycity secret export (cutover only)

# Round 2 of mycity.events' `secret-transfer` (docs/secret-transfer.md in
# prestomation/mycity.events). It seals this repo's Cloudflare credentials to
# each public key in .github/mycity-transfer/*.pem, and prints one envelope
# per key. An envelope is ciphertext: only the private key parked in that
# mycity deployment's SSM opens it, so a public log is safe.
#
# It runs ONLY on the `mycity-migration` branch, never on main (the parallel-run
# rule: 206events main stays untouched until the cutover).

on:
  push:
    branches: [mycity-migration]
    paths: [".github/mycity-transfer/**", ".github/workflows/mycity-secret-export.yml"]

permissions:
  contents: read

jobs:
  seal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Seal the Cloudflare credentials to each mycity public key
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node - <<'JS'
          // The envelope format is sealEnvelope in mycity.events'
          // tools/cli/src/secret-transfer.ts. Keep the two in step.
          const crypto = require("node:crypto");
          const fs = require("node:fs");
          const path = require("node:path");
          const names = ["CLOUDFLARE_API_TOKEN", "CLOUDFLARE_ACCOUNT_ID"];
          const payload = {};
          for (const n of names) {
            const v = process.env[n];
            if (!v) { console.log(`::error::${n} is empty — nothing is sealed.`); process.exit(1); }
            payload[n] = v;
          }
          const hash = (v) => crypto.createHash("sha256").update(v, "utf8").digest("hex").slice(0, 8);
          const dir = ".github/mycity-transfer";
          const keys = fs.readdirSync(dir).filter((f) => f.endsWith(".pem")).sort();
          if (keys.length === 0) { console.log("::error::no public key in " + dir); process.exit(1); }
          let summary = "";
          for (const file of keys) {
            const pub = fs.readFileSync(path.join(dir, file), "utf8");
            const key = crypto.randomBytes(32);
            const iv = crypto.randomBytes(12);
            const cipher = crypto.createCipheriv("aes-256-gcm", key, iv);
            const ct = Buffer.concat([cipher.update(JSON.stringify(payload), "utf8"), cipher.final()]);
            const env = {
              v: 1,
              alg: "RSA-OAEP-SHA256+A256GCM",
              ek: crypto.publicEncrypt({ key: pub, padding: crypto.constants.RSA_PKCS1_OAEP_PADDING, oaepHash: "sha256" }, key).toString("base64"),
              iv: iv.toString("base64"),
              tag: cipher.getAuthTag().toString("base64"),
              ct: ct.toString("base64"),
            };
            const line = Buffer.from(JSON.stringify(env), "utf8").toString("base64");
            summary += `### ${file}\n\n\`\`\`\n${line}\n\`\`\`\n\n`;
            console.log(`ENVELOPE ${file} ${line}`);
          }
          summary += "| key | sha256[0:8] |\n|---|---|\n" + names.map((n) => `| \`${n}\` | \`${hash(payload[n])}\` |`).join("\n") + "\n";
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary);
          for (const n of names) console.log(`HASH ${n} ${hash(payload[n])}`);
          JS
