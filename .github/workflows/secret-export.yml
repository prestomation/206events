name: Secret export (one-time)

# ONE-OFF transfer tool. It seals four repository secrets to a public key and
# prints the result. It never prints a secret value.
#
# WHY IT EXISTS: the four platform API keys below must also reach the managed
# fleet's AWS Secrets Manager bundles (prestomation/mycity.events#341). No
# session can read a GitHub secret, and this repository holds no credential for
# that AWS account. So the fleet makes an RSA keypair inside its own runner,
# prints the PUBLIC key, and this workflow seals the values to it. Only
# ciphertext travels. The fleet opens the envelope in its own account.
#
# HOW TO USE IT:
#   1. In mycity.events, dispatch tenant-tools.yml with
#      command: secret-transfer, filter: keygen. Copy the public key it prints.
#   2. Put that key in .github/secret-transfer-pubkey.pem on this branch.
#   3. Open a pull request. This workflow runs and prints one base64 line.
#   4. In mycity.events, dispatch tenant-tools.yml with
#      command: secret-transfer, filter: import, aws_args: <that line>.
#      Its report prints the same short hashes this run prints. They must match.
#   5. Close this pull request. Nothing here is meant to merge.
#
# It runs on `pull_request` and not on `workflow_dispatch` ON PURPOSE: a
# dispatchable workflow must first exist on `main`, and nothing in this
# transfer merges to `main` (the parallel-run rule). A same-repository pull
# request gets the repository secrets, so the branch is enough.
#
# SAFETY: the values reach `node` through the environment, never through a
# command line or an echo. The output is ciphertext plus the first 8 characters
# of the SHA-256 of each value — enough to prove the right value arrived, never
# enough to recover a key.

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/secret-transfer-pubkey.pem"
      - ".github/workflows/secret-export.yml"

concurrency:
  group: secret-export-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Seal the four platform keys to the fleet's public key
        env:
          TICKETMASTER_API_KEY: ${{ secrets.TICKETMASTER_API_KEY }}
          EVENTBRITE_TOKEN: ${{ secrets.EVENTBRITE_TOKEN }}
          DICE_API_KEY: ${{ secrets.DICE_API_KEY }}
          CANDLELIGHT_ALGOLIA_API_KEY: ${{ secrets.CANDLELIGHT_ALGOLIA_API_KEY }}
        run: |
          set -euo pipefail
          node scripts/secret-export.mjs | tee -a "$GITHUB_STEP_SUMMARY"
