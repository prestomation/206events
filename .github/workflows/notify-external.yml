# Notifies Discord of external interactions and releases on this repo.
# The actual logic lives in prestomation/.github as a reusable workflow.
# The webhook URL is passed as the 'webhook-url' input, reusing the existing
# DISCORD_WEBHOOK_CALENDAR secret (no separate secret needed).

name: Discord Notify External

on:
  issues:
    types: [opened, edited, closed, reopened]
  issue_comment:
    types: [created]
  pull_request:
    types: [opened, edited, closed, reopened, review_requested]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created]
  release:
    types: [published]

jobs:
  notify:
    uses: prestomation/.github/.github/workflows/notify-discord.yml@main
    with:
      webhook-url: ${{ secrets.DISCORD_WEBHOOK_CALENDAR }}
