s stories, creative memories, and plenty of laughs.\\r\\n\\r\\nFacilitated by Joe Guppy. \\r\\n\\r\\n\"},{\"id\":3185,\"name\":\"Live Jazz: The Brian Monroney Trio \",\"title\":\"$undefined\",\"start_date\":\"2026-09-24 00:00:00\",\"end_date\":\"2026-09-24 23:59:59\",\"event_type\":\"Performance\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3185_thumbnail_41025b2e77b5cfb6.jpg\"}],\"description\":\"For Art + Culture Week, The Occidental Fine Arts Center welcomes The Brian Monroney Trio.\\r\\n\\r\\nFeaturing Brian Monroney on guitar, Hans Teuber on saxophone, and Wayne Bliss on bass, this exceptional trio brings together three accomplished Seattle musicians for an intimate and engaging musical experience. Their performance blends beautiful melodies, sophisticated jazz harmonies, and dynamic interplay, creating a warm and captivating atmosphere for the audience.\"},{\"id\":3135,\"name\":\"Manhattan Short Film Festival\",\"title\":\"$undefined\",\"start_date\":\"2026-09-24 00:00:00\",\"end_date\":\"2026-09-27 23:59:59\",\"event_type\":\"Film\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Bainbridge Island Museum of Art\",\"street\":\"550 Winslow Way E, Bainbridge Island, WA 98110\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":252,\"lat\":\"47.62514320\",\"lon\":\"-122.51452760\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/252_thumbnail_f49f33ec2d6c3f9d.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3135_thumbnail_6554b6cd1148e23a.jpg\"}],\"description\":\"The Manhattan Short Film Festival returns to BIMA September 24–27 with 10 short films from around the world. During this globally synchronized event, audiences serve as the jury, voting for best film and best actor. Previous selections have earned Academy Award consideration, with two films going on to win Oscars. Presented as part of BIMA’s PRISM Program, this ticketed festival offers multiple screenings over four days.\\r\\n\"},{\"id\":1954,\"name\":\"Xian Zhang and James Ehnes\",\"title\":\"$undefined\",\"start_date\":\"2026-09-24 00:00:00\",\"end_date\":\"2026-09-27 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Symphony\",\"street\":\"Benaroya Hall, 200 University St. \",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":295,\"lat\":\"47.60817500\",\"lon\":\"-122.33676390\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/295_thumbnail_7a1b76264b000786.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1954_thumbnail_5af69b64c77e57af.jpg\"}],\"description\":\"Join the Seattle Symphony as Music Director Xian Zhang opens the Symphonic Series with works by Bruch and Berlioz. Featuring acclaimed violinist James Ehnes performing Bruch's Violin Concerto No. 1, the program culminates in Berlioz's dramatic Symphonie fantastique, a Romantic masterpiece renowned for its bold orchestration and emotional intensity.\"},{\"id\":3173,\"name\":\"*PRIVATE EVENT* Seattle Pelikan Hub Hosted by Outpost Stationery\",\"title\":\"$undefined\",\"start_date\":\"2026-09-25 00:00:00\",\"end_date\":\"2026-09-25 23:59:59\",\"event_type\":\"Private Event\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3173_thumbnail_32f245929c2c8e60.jpg\"}],\"description\":\"*THIS IS A PRIVATE EVENT*\\r\\n\\r\\nA note about the host, Outpost Stationery:  The Outpost Stationery is a space where independent thinkers find the pleasure of keeping ideas on paper.\\r\\n\\r\\n157 S Jackson Street, Seattle WA, 98104\\r\\nHours\\r\\nTuesday - Saturday 12PM - 6PM\\r\\nSunday 12PM-3PM\\r\\n\\r\\nA note about Pelikan Hubs: The Pelikan Hubs are a tribute to the timeless passion for fine writing and the beauty of exceptional instruments.\\r\\n\\r\\nBy joining, you immerse yourself in the unique world of Pelikan—a brand renowned for its prestigious heritage of over 188 years.\\r\\n\\r\\nIt is a rare opportunity to bring this rich history to life, sharing your love for 'le bel objet' with a community that appreciates the soul behind the pen. Beyond the ink and paper, the essence of the Hubs lies in authentic connection: a moment to exchange stories and celebrate a legendary craftsmanship that continues to inspire enthusiasts across the globe.\"},{\"id\":1024,\"name\":\"ART \u0026 CULTURE WEEK:  Downtown Art Walk: DJ+Dance at Art Love Salon with DJ Afreesha and dance from Bent Collective \",\"title\":\"$undefined\",\"start_date\":\"2026-09-25 00:00:00\",\"end_date\":\"2026-09-25 23:59:59\",\"event_type\":\"Dance\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\":\"110 Union Street, 5th floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":462,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/462_thumbnail_2053695641081a34.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1024_thumbnail_31874dfb1c7e253f.jpg\"}],\"description\":\"As part of your Downtown Art Walk route, Art Love Salon is an expansive stop offering live dance performances alongside exhibitions across two floors and three galleries—Art Love Salon Gallery, Public Display Art Gallery, and rotating guest pop-up installations—showcasing work by over 100 local visual artists.\\r\\n\\r\\nThis month, that includes a DJ+Dance set from open-format DJ Afreesha.  Affresha is a Seattle-based DJ, curator, and educator who mixes reggae, dancehall, afrobeats, soca, and Latin sounds into genre-defying sets. With dance performances from Bent Collective.\\r\\n\\r\\nProgram details vary month to month; what remains constant is an open, welcoming atmosphere and a celebration of the depth and vitality of Seattle’s creative community.\\r\\n\\r\\nDowntown Art Walk takes place every fourth Friday of the month.\\r\\n\\r\\nFree with RSVP · Open to all · Refreshments provided\\r\\n\\r\\nArtwork by Rowan Eriksson on view at Art Love Salon gallery\"},{\"id\":2834,\"name\":\"Creative Mornings Seattle \",\"title\":\"$undefined\",\"start_date\":\"2026-09-25 00:00:00\",\"end_date\":\"2026-09-25 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":\"Greater Seattle\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Creative Mornings Seattle\",\"street\":\"\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":468,\"lat\":\"38.79459520\",\"lon\":\"-106.53483790\",\"neighborhood\":\"Greater Seattle\",\"main_photo\":\"/art/photos/organizations/468_thumbnail_486dfcf1daf3b751.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2834_thumbnail_6e863617fb41171f.jpg\"}],\"description\":\"\\r\\nCreativeMornings is a global breakfast lecture series designed to inspire and connect the creative community. Founded in\\r\\n2008 by Tina Roth Eisenberg in New York, the concept is simple: one Friday morning a month, attendees gather for a free\\r\\nevent featuring coffee, breakfast, and a short talk by a local speaker. Each event centers around a shared global theme\\r\\nand encourages meaningful connections among diverse participants. With chapters in over 180 cities worldwide,\\r\\nCreativeMornings celebrates local talent, promotes open dialogue, and fosters a spirit of generosity, curiosity, and\\r\\ncollaboration. Everyone is welcome—because everyone is creative.\"},{\"id\":2481,\"name\":\"Serenade\",\"title\":\"$undefined\",\"start_date\":\"2026-09-25 00:00:00\",\"end_date\":\"2026-10-04 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Pacific Northwest Ballet\",\"street\":\"McCaw Hall, 321 Mercer St.\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":255,\"lat\":\"47.62399940\",\"lon\":\"-122.35027140\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2481_thumbnail_b2a2785785f85753.jpg\"}],\"description\":\"Pacific Northwest Ballet opens its 2026/27 season with a captivating triple bill celebrating romance, artistry, and beauty. The program features George Balanchine’s ethereal Serenade, Alexei Ratmansky’s vibrant Pictures at an Exhibition, and a new work by Jessica Lang. Set to lush music and performed by PNB’s exceptional dancers, this season opener promises an unforgettable evening of dance.\"},{\"id\":2429,\"name\":\"Seven Lions with the Seattle Symphony\",\"title\":\"$undefined\",\"start_date\":\"2026-09-25 00:00:00\",\"end_date\":\"2026-09-25 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Symphony\",\"street\":\"Benaroya Hall, 200 University St. \",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":295,\"lat\":\"47.60817500\",\"lon\":\"-122.33676390\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/295_thumbnail_7a1b76264b000786.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2429_thumbnail_1a0ac64c586cd974.jpg\"}],\"description\":\"Electronic music producer Seven Lions joins the Seattle Symphony for a one-night-only performance featuring orchestral reimaginings of fan favorites like \\\"First Time,\\\" \\\"Rush Over Me\\\" and \\\"Worlds Apart.\\\" Experience his signature blend of melodic bass, dubstep, trance and cinematic soundscapes in an unforgettable live concert.\"},{\"id\":1673,\"name\":\"Umbrella Fringe Festival\",\"title\":\"$undefined\",\"start_date\":\"2026-09-25 00:00:00\",\"end_date\":\"2026-09-27 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Kirkland Arts Center\",\"street\":\"620 Market St\",\"city\":\"Kirkland\",\"state_code\":\"WA\",\"zip\":\"98033\",\"id\":21,\"lat\":\"47.68019860\",\"lon\":\"-122.20931550\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/21_thumbnail_b4fab6bc38dca468.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1673_thumbnail_ea3994bcd4f9f658.jpg\"}],\"description\":\"Umbrella Fringe is a festival celebrating bold, experimental performances in theater, dance, comedy, music, and multimedia art. Featuring emerging and established artists, the festival transforms Kirkland with pop-up performances and immersive experiences that invite audiences to explore the unexpected.\\r\\n\"},{\"id\":2462,\"name\":\"ART \u0026 CULTURE WEEK:  IMMINENT MODE: Evolution\",\"title\":\"$undefined\",\"start_date\":\"2026-09-26 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Imminent Mode\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":790,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2462_thumbnail_07c5974965cbb38c.jpg\"}],\"description\":\"$1f\"},{\"id\":2700,\"name\":\"Community Reading \u0026 Feedback Session with Writer Reagan Jackson\",\"title\":\"$undefined\",\"start_date\":\"2026-09-26 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Literature\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"4Culture\",\"street\":\"101 Prefontaine Pl S\",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":42,\"lat\":\"47.60137480\",\"lon\":\"-122.32999500\",\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/organizations/42_thumbnail_f45693f50efa2f19.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2700_thumbnail_c3713919e59a612e.jpg\"}],\"description\":\"Join author Reagan Jackson and local young performers for a live staged reading of Sankofa and Second Chances (working title), directed by Intiman Theatre’s Wesley Frugé. Set in Seattle’s Central District, the novel follows four teens as they confront displacement, neighborhood history, and a spiritual world rooted in the Orishas. Audience feedback will help shape the book before its final edits.\"},{\"id\":3041,\"name\":\"Jovino Santos Neto Trio\",\"title\":\"$undefined\",\"start_date\":\"2026-09-26 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Music\",\"neighborhood\":\"queen_anne\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Fountainhead Gallery\",\"street\":\"625 W McGraw St\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98119\",\"id\":127,\"lat\":\"47.63945850\",\"lon\":\"-122.36610840\",\"neighborhood\":\"queen_anne\",\"main_photo\":\"/art/photos/organizations/127_thumbnail_70effbb4592ec101.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3041_thumbnail_92ffbe3b2d130f51.jpg\"}],\"description\":\"Three-time Latin Grammy nominee Jovino Santos Neto returns to Fountainhead Gallery for his fourth concert at the venue. The Seattle-based Brazilian pianist, composer, flutist, and multi-instrumentalist is celebrated for blending Brazilian musical traditions with contemporary jazz and spirited improvisation. Joined by Tim Carey on bass and Jeff Busch on percussion, Santos Neto will perform original compositions filled with intricate rhythms and expressive interplay. Tickets are available for this intimate evening of world-class Brazilian jazz.\\r\\n\"},{\"id\":2754,\"name\":\"Living Archives: Photography, Memory and the Right to Look\",\"title\":\"$undefined\",\"start_date\":\"2026-09-26 00:00:00\",\"end_date\":\"2026-12-05 23:59:59\",\"event_type\":\"Workshop\",\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Photographic Center Northwest \",\"street\":\"900 12th Ave \",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98122\",\"id\":52,\"lat\":\"47.61055230\",\"lon\":\"-122.31643240\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/52_thumbnail_d36c4bcb5792a72b.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2754_thumbnail_512579e9bb3c7bfa.jpg\"}],\"description\":\"Explore how photographs, objects, family records, and lived memory can shape contemporary photographic practice. Through lectures, readings, exercises, and critiques, students will examine archival research, ethical storytelling, and Indigenous approaches to visual sovereignty while developing their own archival-based project. Ideal for photographers interested in transforming historical materials into meaningful contemporary work.\"},{\"id\":2461,\"name\":\"Mothers Impacting Lives Every Day (MILE)\",\"title\":\"$undefined\",\"start_date\":\"2026-09-26 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Mothers Impacting Lives Every Day (MILE)\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":896,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2461_thumbnail_c2e9612e07c78ac1.jpg\"}],\"description\":\"Moms, it's time to pour into yourself. 💙\\r\\n\\r\\nJoin MILE for Moms on the Move, a monthly wellness series designed to give mothers a safe, supportive space to recharge, connect, and prioritize their well-being.\\r\\n\\r\\nThis September, we'll explore practical strategies for self-care, stress management, and building sustainable wellness habits while balancing the demands of motherhood. Through meaningful conversations and interactive activities, you'll leave feeling refreshed, empowered, and supported by a community that understands.\\r\\n\\r\\nBecause caring for yourself is one of the best ways to care for your family.\"},{\"id\":2869,\"name\":\"Seattle Irish Dance Company Choreography Showcase\",\"title\":\"$undefined\",\"start_date\":\"2026-09-26 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":null,\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"4Culture\",\"street\":\"101 Prefontaine Pl S\",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":42,\"lat\":\"47.60137480\",\"lon\":\"-122.32999500\",\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/organizations/42_thumbnail_f45693f50efa2f19.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2869_thumbnail_9d9dad4e7932a0c8.jpg\"}],\"description\":\"Enjoy an evening of Irish dance and music at the Seattle Irish Dance Company Choreography Showcase at Erickson Theatre. The showcase features original Irish dance pieces, live Irish music from The Morrigans, and a lively celebration of Irish culture. The event is sponsored by ArtsWA and 4Culture, with Seattle Irish Dance Company powered by Shunpike.\"},{\"id\":3103,\"name\":\"Game Devs of Color Expo Watch Party\",\"title\":\"$undefined\",\"start_date\":\"2026-09-27 00:00:00\",\"end_date\":\"2026-09-27 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":\"Seattle\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Seattle Indies \",\"street\":\"\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":315,\"lat\":\"38.79459520\",\"lon\":\"-106.53483790\",\"neighborhood\":\"Seattle\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3103_thumbnail_a5ec160eb6651570.jpg\"}],\"description\":\"Note: This is a partner event. Please visit the URL to RSVP.\\r\\n\\r\\nFree in-person watch party for select VOD talks from GDoC Expo 2026. Open to anyone and hosted by Seattle Indies’ Diversity Collective.\\r\\n\\r\\nAs a bonus, any folks who RSVP will get a virtual full-access code to watch the expo live and access VODs afterwards. Come by to celebrate game devs of color, there will be demos, food, and fun!\\r\\n\\r\\nHave a game to show? - Fill out this form before Sept 18th\\r\\nTransit - Symphony Light Rail Station and University Street Station are both 2 blocks away\\r\\nParking - Target Garage across the alley, use discount code PDA3 for $3 off under 3 hours or PDA5 for $5 off over 3 hours\\r\\nPlease try to respond before Sept 24 to ensure we provide enough food.\"},{\"id\":1742,\"name\":\"Photo Zines: Sequence and Choice\",\"title\":\"$undefined\",\"start_date\":\"2026-09-27 00:00:00\",\"end_date\":\"2026-10-11 23:59:59\",\"event_type\":\"Workshop\",\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Photographic Center Northwest \",\"street\":\"900 12th Ave \",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98122\",\"id\":52,\"lat\":\"47.61055230\",\"lon\":\"-122.31643240\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/52_thumbnail_d36c4bcb5792a72b.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1742_thumbnail_435111604b41f3aa.jpg\"}],\"description\":\"Learn how to turn photography into a self-published zine through hands-on exercises in sequencing, editing, layout, and production. Explore zine history, printing techniques, and ways to transform your own or found imagery into a cohesive publication.\"},{\"id\":2755,\"name\":\"Lith Printing\",\"title\":\"$undefined\",\"start_date\":\"2026-09-28 00:00:00\",\"end_date\":\"2026-11-30 23:59:59\",\"event_type\":\"Workshop\",\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Photographic Center Northwest \",\"street\":\"900 12th Ave \",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98122\",\"id\":52,\"lat\":\"47.61055230\",\"lon\":\"-122.31643240\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/52_thumbnail_d36c4bcb5792a72b.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2755_thumbnail_1a44675fca7151cd.jpg\"}],\"description\":\"Explore the unpredictable, expressive art of lith printing in this 10-week darkroom course led by Leah Freed. Learn to create distinctive black-and-white prints with dramatic contrast, warm tones, and atmospheric textures while experimenting with chemistry, paper, and development techniques. Registration required.\"},{\"id\":1205,\"name\":\"Downtown Community Council Birthday Bash\",\"title\":\"$undefined\",\"start_date\":\"2026-09-29 00:00:00\",\"end_date\":\"2026-09-29 23:59:59\",\"event_type\":\"Unknown\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Downtown Community Council\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":558,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1205_thumbnail_f84e7e35b9844341.jpg\"}],\"description\":\"Let's get 2-gether to taste the best of Downtown!\\r\\n\\r\\nThe DCC is turning 2! Join us for a fun-filled evening with special bites and delights from:\\r\\n\\r\\nLingon Restaurant | Truffle Queen | Silver Slice Bakery | Gold Coast Kitchen | Nine Hats Winery | Rabbit Box Cocktails | DJ Billy Thompson | Pike Place Podcast\\r\\n\\r\\n21 \u0026 over only. RSVP Required.\"},{\"id\":2430,\"name\":\"UNDERTALE: Determination Symphony with the Seattle Symphony\",\"title\":\"$undefined\",\"start_date\":\"2026-09-29 00:00:00\",\"end_date\":\"2026-10-06 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Symphony\",\"street\":\"Benaroya Hall, 200 University St. \",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":295,\"lat\":\"47.60817500\",\"lon\":\"-122.33676390\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/295_thumbnail_7a1b76264b000786.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2430_thumbnail_dab1496ff650f38a.jpg\"}],\"description\":\"Experience the music of the beloved indie game UNDERTALE as the Seattle Symphony performs newly arranged live orchestral versions of its most iconic themes. Accompanied by gameplay footage, this immersive concert brings the game's unforgettable story, characters and soundtrack to life.\"},{\"id\":1329,\"name\":\"Weekly Tai Chi \u0026 Qigong in the Park                  \",\"title\":\"$undefined\",\"start_date\":\"2026-09-29 00:00:00\",\"end_date\":\"2026-09-29 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\":\"110 Union Street, 5th floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":462,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/462_thumbnail_2053695641081a34.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1329_thumbnail_56847175c6de290a.jpg\"}],\"description\":\"Mindful Movement at Art Love Salon\\r\\n\\r\\nArt Love Salon is proud to sponsor this weekly mindful movement session inspired by Tai Chi and Qigong.\\r\\n\\r\\nJoin us each Tuesday at Art Love Salon for a gentle, beginner-friendly practice led by instructor Karin Philomin. The session incorporates simple Tai Chi and Qigong-inspired movements designed to support posture, balance, breath, relaxation, and a greater sense of calm.\\r\\n\\r\\nWhether you are new to Tai Chi or already familiar with the practice, everyone is welcome. The session offers an opportunity to slow down, reconnect with the body, and enjoy mindful movement in a welcoming indoor setting.\\r\\n\\r\\nWhen: Tuesdays, 12:00–1:00 PM\\r\\n\\r\\nWhere:\\r\\nArt Love Salon\\r\\n110 Union St, 5th Floor\\r\\nSeattle, WA\\r\\n\\r\\nWhat to Expect:\\r\\nA gentle Tai Chi and Qigong-inspired practice focusing on posture, balance, breathing, and simple flowing movements. The session is suitable for beginners and can be adapted to individual comfort levels.\\r\\n\\r\\nCome move, breathe, and reset with us at Art Love Salon!\"},{\"id\":2858,\"name\":\"Intiman Board and Staff Retreat\",\"title\":\"$undefined\",\"start_date\":\"2026-09-30 00:00:00\",\"end_date\":\"2026-09-30 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Intiman Theatre\",\"street\":\"801 E Pine St. (in the Fine Arts Building at Seattle Central College)\",\"city\":\"Seattle\",\"state_code\":\"Wa\",\"zip\":\"98122\",\"id\":220,\"lat\":\"47.60613890\",\"lon\":\"-122.33284810\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/220_thumbnail_9a18fcce5e81b834.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2858_thumbnail_d6d10e0ba9c9d795.jpg\"}],\"description\":\"Intiman Theatre uses the power of story and education to\\r\\nactivate dialogue, confront inequity, and build\\r\\ncollective joy.\"},{\"id\":1251,\"name\":\"SALON SOCIAL - with live music from Dxvincenzo \",\"title\":\"$undefined\",\"start_date\":\"2026-09-30 00:00:00\",\"end_date\":\"2026-09-30 23:59:59\",\"event_type\":\"Salon Social\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\":\"110 Union Street, 5th floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":462,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/462_thumbnail_2053695641081a34.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1251_thumbnail_dd9433b7c4b58842.jpg\"}],\"description\":\"Welcoming back Dxvincenzo for our weekly Salon Social with an immersive live soundscapes built from cello, voice, and looping. Blending classical textures with lo-fi grooves and modern pop influences, he creates songs in real time—transforming a single instrument into a layered, cinematic experience.\\r\\n\\r\\nJoin us for this special appearance as Dxvincenzo fills the gallery with rich, evolving sound—perfect for a mid-week pause surrounded by art, music, and community.\\r\\n\\r\\nAlways free with RSVP!\"},{\"id\":2195,\"name\":\"Salon Studio Series: CHARCOAL DRAWING with Garima Tripathi \",\"title\":\"$undefined\",\"start_date\":\"2026-09-30 00:00:00\",\"end_date\":\"2026-09-30 23:59:59\",\"event_type\":\"Workshop: Art\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Conru Foundation\",\"street\":\"110 Union Street, Suite 400\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98121\",\"id\":1,\"lat\":\"47.60782530\",\"lon\":\"-122.33911480\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/1_thumbnail_14851f2f20333e70.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2195_thumbnail_a2a8f16af0b3a4c6.jpg\"}],\"description\":\"$20\"},{\"id\":3698,\"name\":\"FIRST THURSDAY ART WALK: Taz \u0026 Jazz at Occidental Fine Arts Center\",\"title\":\"$undefined\",\"start_date\":\"2026-10-01 00:00:00\",\"end_date\":\"2026-10-01 23:59:59\",\"event_type\":\"Performance\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos //artlove.org/art/photos/events/2473_thumbnail_de0803d9bbd3ae04.jpg\"}],\"description\":\"Sound Theatre Company closes its 2026 season with José Rivera’s References to Salvador Dalí Make Me Hot, a poetic and surreal exploration of love, longing, and desire. Set in the California desert, the play follows Gabriela as she escapes into an imaginative world while navigating the challenges of her husband’s long absences. Winner of the 2001 Obie Award, Rivera’s acclaimed work blends fantasy and reality in a unique and thought-provoking theatrical experience.\"},{\"id\":2158,\"name\":\"Trust Me!!!\",\"title\":\"$undefined\",\"start_date\":\"2026-10-01 00:00:00\",\"end_date\":\"2026-10-01 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"RAD Arts Foundation\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":998,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/998_thumbnail_80d3734c3ff1dabb.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2158_thumbnail_647f7bc12c4b0350.jpg\"}],\"description\":\"Trust Me!!! is a dark comedy from acclaimed Iranian filmmaker Maziar Miri about a close-knit community whose lively gatherings are thrown into chaos when a long-buried secret comes to light. Starring Shabnam Tolouei, Afshin Hashemi, Shadi Najand, and Ahmad Hashemian, Miri's first U.S. theatrical production explores family, friendship, and the unexpected consequences of hidden truths. By the final curtain, you'll be left wondering whether some secrets really are better left buried.\"},{\"id\":1616,\"name\":\"Booking: Artists’ Books by Black Artists\",\"title\":\"$undefined\",\"start_date\":\"2026-10-02 00:00:00\",\"end_date\":\"2027-02-22 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Bainbridge Island Museum of Art\",\"street\":\"550 Winslow Way E, Bainbridge Island, WA 98110\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":252,\"lat\":\"47.62514320\",\"lon\":\"-122.51452760\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/252_thumbnail_f49f33ec2d6c3f9d.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1616_thumbnail_4f292939f4de97ad.jpg\"}],\"description\":\"This exhibition showcases artists’ books by Black creators, highlighting innovative storytelling through words, images, and materials. Exploring personal, historical, and cultural experiences, the works expand perspectives and celebrate the richness of contemporary Black book art.\"},{\"id\":3136,\"name\":\"Camila Ferrari - Within Earshot Jazz Festival\",\"title\":\"$undefined\",\"start_date\":\"2026-10-02 00:00:00\",\"end_date\":\"2026-10-02 23:59:59\",\"event_type\":\"Music\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Bainbridge Island Museum of Art\",\"street\":\"550 Winslow Way E, Bainbridge Island, WA 98110\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":252,\"lat\":\"47.62514320\",\"lon\":\"-122.51452760\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/252_thumbnail_f49f33ec2d6c3f9d.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3136_thumbnail_c647d71ed58fb282.jpg\"}],\"description\":\"Uruguayan singer-songwriter Camila Ferrari brings her emotionally charged blend of indie, alternative, and pop-rock to BIMA’s Frank Buxton Auditorium on October 2 from 7–8:45 p.m. Presented as part of the 2026 Within/Earshot Jazz Festival and BIMA’s PRISM program, the performance showcases Ferrari’s powerful vocals and intimate songwriting. Acclaimed Seattle musician Jherek Bischoff joins her on bass for this rare opportunity to experience one of South America’s rising artists up close. Tickets are available through BIMA.\"},{\"id\":2431,\"name\":\"Ennio Morricone: The Official Symphonic Experience\",\"title\":\"$undefined\",\"start_date\":\"2026-10-02 00:00:00\",\"end_date\":\"2026-10-04 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Symphony\",\"street\":\"Benaroya Hall, 200 University St. \",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":295,\"lat\":\"47.60817500\",\"lon\":\"-122.33676390\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/295_thumbnail_7a1b76264b000786.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2431_thumbnail_9ae640b7a3902cf6.jpg\"}],\"description\":\"Celebrate the music of legendary composer Ennio Morricone with the Seattle Symphony performing unforgettable scores from Cinema Paradiso, The Mission, Once Upon a Time in the West and more. Featuring iconic film clips and exclusive interviews, this multimedia concert is a tribute to one of cinema's greatest musical storytellers.\"},{\"id\":3188,\"name\":\"Game Accessibility Conference Mixer\",\"title\":\"$undefined\",\"start_date\":\"2026-10-02 00:00:00\",\"end_date\":\"2026-10-02 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"International Game Developers Association (IGDA)\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":1187,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3188_thumbnail_46cfd7a943feb184.jpg\"}],\"description\":\"An evening social mixer for game developers and professionals passionate about making games more accessible to players with disabilities. Hosted by the IGDA Game Accessibility Special Interest Group (SIG), the event will bring together members of the game development community to connect, share ideas, and build relationships around inclusive and accessible game design.\\r\\n\\r\\nWith GAConf US taking place online this year, this in-person mixer will complement the conference’s virtual networking and Discord activities. Scheduled near PAX, the gathering offers an opportunity to connect face-to-face while game developers and industry professionals from across the region and beyond are in Seattle.\"},{\"id\":2868,\"name\":\"Noises Off \",\"title\":\"$undefined\",\"start_date\":\"2026-10-02 00:00:00\",\"end_date\":\"2026-10-18 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Renton Civic Theatre\",\"street\":\"507 S Third St\",\"city\":\"Renton\",\"state_code\":\"WA\",\"zip\":\"98057\",\"id\":1132,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2868_thumbnail_51957642dbd3e6e6.jpg\"}],\"description\":\"Noises Off is a hilarious backstage farce filled with missed cues, collapsing sets, romantic entanglements, and theatrical chaos. Follow a bumbling troupe as their mediocre production spirals spectacularly out of control. Expect nonstop laughter, slamming doors, flying sardines, and plenty of mayhem.\\r\\n\"},{\"id\":3144,\"name\":\" Afro Live Jam Sessions\",\"title\":\"$undefined\",\"start_date\":\"2026-10-03 00:00:00\",\"end_date\":\"2026-10-03 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Afro Live Jams\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":1182,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3144_thumbnail_476b0a145d041ca0.jpg\"}],\"description\":\"Afro Live Jams Session is a vibrant live music experience that brings people together through the infectious energy of Afrobeats and global sounds. \\r\\n\\r\\nFeaturing an eight-member band, the event blends dynamic percussion, rhythmic keys, and soulful saxophone melodies with modern African rhythms and global influences. The result is an immersive, feel-good celebration of music, culture, and community.\"},{\"id\":2882,\"name\":\"Game Devs of Color Expo Watch Party\",\"title\":\"$undefined\",\"start_date\":\"2026-10-03 00:00:00\",\"end_date\":\"2026-10-03 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":\"Seattle\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Seattle Indies \",\"street\":\"\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":315,\"lat\":\"38.79459520\",\"lon\":\"-106.53483790\",\"neighborhood\":\"Seattle\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2882_thumbnail_de015c48c2279254.jpg\"}],\"description\":\"An in-person gathering celebrating game devs of color! 🎮\\r\\n\\r\\nWatch the Game Devs of Color Expo together, connect with like-minded developers, and discover games from local game devs of color.\"},{\"id\":2756,\"name\":\"Hands-on Introduction to Studio Lighting\",\"title\":\"$undefined\",\"start_date\":\"2026-10-03 00:00:00\",\"end_date\":\"2026-10-04 23:59:59\",\"event_type\":\"Workshop\",\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Photographic Center Northwest \",\"street\":\"900 12th Ave \",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98122\",\"id\":52,\"lat\":\"47.61055230\",\"lon\":\"-122.31643240\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/52_thumbnail_d36c4bcb5792a72b.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2756_thumbnail_ff0f022a65e2754d.jpg\"}],\"description\":\"Join Kate Baldwin for a hands-on workshop exploring how to understand and manipulate light in photography. Learn to work with natural light, reflectors, continuous lighting, strobes, and mixed-light setups. October 3–4, 2026; foundation/intermediate level with basic camera knowledge required.\\r\\n\"},{\"id\":2491,\"name\":\"NILADRI KUMAAR THE SPACE BETWEEN THE NOTES, HONORING ZAKIR HUSSAIN\",\"title\":\"$undefined\",\"start_date\":\"2026-10-04 00:00:00\",\"end_date\":\"2026-10-04 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Theatre Group\",\"street\":\"911 Pine Street\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":1054,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2491_thumbnail_40b1c3508dd6baed.jpg\"}],\"description\":\"Experience the artistry of sitar maestro Niladri Kumaar in a captivating musical journey that blends centuries-old Indian classical traditions with creative innovation. Featuring his signature sitar and zitar alongside Indian and American musicians, Space Between the Notes also honors his celebrated musical partnership with the late Zakir Hussain through selections from their historic recording together.\"},{\"id\":1330,\"name\":\"Weekly Tai Chi \u0026 Qigong in the Park                   \",\"title\":\"$undefined\",\"start_date\":\"2026-10-06 00:00:00\",\"end_date\":\"2026-10-06 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\":\"110 Union Street, 5th floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":462,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/462_thumbnail_2053695641081a34.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1330_thumbnail_e7c6997b17be9ef2.jpg\"}],\"description\":\"$21\"},{\"id\":1425,\"name\":\"SALON SOCIAL — Curated by D’Vonne Lewis  \",\"title\":\"$undefined\",\"start_date\":\"2026-10-07 00:00:00\",\"end_date\":\"2026-10-07 23:59:59\",\"event_type\":\"Salon Social\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\":\"110 Union Street, 5th floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":462,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/462_thumbnail_2053695641081a34.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1425_thumbnail_11815d8b41d8cbbc.jpg\"}],\"description\":\"$22\"},{\"id\":2757,\"name\":\"Studio Fashion Photography \u0026 Retouching with Photoshop\",\"title\":\"$undefined\",\"start_date\":\"2026-10-07 00:00:00\",\"end_date\":\"2026-10-28 23:59:59\",\"event_type\":\"Workshop\",\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Photographic Center Northwest \",\"street\":\"900 12th Ave \",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98122\",\"id\":52,\"lat\":\"47.61055230\",\"lon\":\"-122.31643240\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/52_thumbnail_d36c4bcb5792a72b.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2757_thumbnail_69bdde1f55de4356.jpg\"}],\"description\":\"Explore fashion photography from studio lighting and model direction to professional Photoshop retouching. Develop a polished, publication-ready workflow for commercial, editorial, and fine-art work. Multi-week workshop; registration required.\"},{\"id\":3137,\"name\":\"An Evening with METTA QUINTET: Coltrane and Miles at 100\",\"title\":\"$undefined\",\"start_date\":\"2026-10-08 00:00:00\",\"end_date\":\"2026-10-08 23:59:59\",\"event_type\":\"Music\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Bainbridge Island Museum of Art\",\"street\":\"550 Winslow Way E, Bainbridge Island, WA 98110\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":252,\"lat\":\"47.62514320\",\"lon\":\"-122.51452760\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/252_thumbnail_f49f33ec2d6c3f9d.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3137_thumbnail_831e840e223c19ac.jpg\"}],\"description\":\"New York City’s acclaimed METTA QUINTET celebrates the 100th birthdays of jazz icons John Coltrane and Miles Davis at BIMA’s Frank Buxton Auditorium on October 8 from 7–9:15 p.m. Presented as part of the 2026 Within/Earshot Jazz Festival and BIMA’s PRISM program, the concert explores the artists’ groundbreaking music and lasting cultural influence. Known for exceptional musicianship and an adventurous approach, the ensemble honors jazz tradition while bringing fresh perspectives to the genre. Tickets are available through BIMA.\"},{\"id\":2881,\"name\":\"MUSIC SOIRÉE - Glass House String Quartet\",\"title\":\"$undefined\",\"start_date\":\"2026-10-08 00:00:00\",\"end_date\":\"2026-10-08 23:59:59\",\"event_type\":\"Internal Event\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Conru Foundation\",\"street\":\"110 Union Street, Suite 400\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98121\",\"id\":1,\"lat\":\"47.60782530\",\"lon\":\"-122.33911480\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/1_thumbnail_14851f2f20333e70.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2881_thumbnail_3219dfcfc3be8981.jpg\"}],\"description\":\"$23\"},{\"id\":3138,\"name\":\"Afrocop\",\"title\":\"$undefined\",\"start_date\":\"2026-10-09 00:00:00\",\"end_date\":\"2026-10-09 23:59:59\",\"event_type\":\"Music\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Bainbridge Island Museum of Art\",\"street\":\"550 Winslow Way E, Bainbridge Island, WA 98110\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":252,\"lat\":\"47.62514320\",\"lon\":\"-122.51452760\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/252_thumbnail_f49f33ec2d6c3f9d.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3138_thumbnail_e5860b80855b3e9e.jpg\"}],\"description\":\"Seattle trio Afrocop brings its improvisational blend of jazz, funk, psychedelia, Afrobeat, and electronic soundscapes to BIMA on October 9 from 7–8:45 p.m. Featuring Noel Brass Jr. on keys, Andy Sells on drums, and Carlos Tulloss on bass, the band creates soulful, unpredictable music shaped live in the moment. Presented at the Frank Buxton Auditorium as part of the 2026 Within/Earshot Jazz Festival and BIMA’s PRISM program, each performance offers a one-of-a-kind sonic experience. Tickets are available through BIMA.\\r\\n\"},{\"id\":2480,\"name\":\"RAT CAGE\",\"title\":\"$undefined\",\"start_date\":\"2026-10-09 00:00:00\",\"end_date\":\"2026-10-24 23:59:59\",\"event_type\":null,\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Annex Theatre\",\"street\":\"1100 E Pike St.\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98122\",\"id\":247,\"lat\":\"47.61426640\",\"lon\":\"-122.31783350\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/247_thumbnail_c7ffdb5c66f625bb.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2480_thumbnail_be9efce4172466bb.jpg\"}],\"description\":\"Annex Theatre presents Rat Cage, a darkly comic play by Coco Justino about the pressures of work, family, relationships, and the constant stream of bad news. When burlesque artist Vendetta Payne is drawn into a bizarre world where trauma becomes a commodity, her life takes an unexpected turn. This sharp and unconventional production explores what happens when personal struggles become part of the marketplace.\"},{\"id\":2860,\"name\":\"We Heart Seattle Fundraiser with Eric Zimmerman and Tom Wolf\",\"title\":\"$undefined\",\"start_date\":\"2026-10-09 00:00:00\",\"end_date\":\"2026-10-09 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":\"Greater Seattle\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"We Heart Seattle\",\"street\":\"\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":465,\"lat\":\"38.79459520\",\"lon\":\"-106.53483790\",\"neighborhood\":\"Greater Seattle\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2860_thumbnail_6e681a65b707d5b0.jpg\"}],\"description\":\"Join We Heart Seattle for an engaging Lunch \u0026 Learn exploring the realities of homelessness, addiction recovery, and public safety in our region.\\r\\n\\r\\nHear from founder Andrea Suarez, Board Vice President Tom Wolf, the Mayor of Normandy Park, and other subject matter experts as they share data-driven insights, policy updates, and firsthand perspectives on the challenges—and opportunities—facing our communities.\\r\\n\\r\\nConnect with civic leaders, volunteers, advocates, artists, and neighbors for an afternoon of meaningful conversation, community, and action. Together, we can help shape a stronger future for Seattle.\"},{\"id\":3661,\"name\":\"A Conversation with Seattle Author and Director David Norman Lewis\",\"title\":\"$undefined\",\"start_date\":\"2026-10-10 00:00:00\",\"end_date\":\"2026-10-10 23:59:59\",\"event_type\":\"Talk\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3661_thumbnail_6abd1f3b049f87e4.jpg\"}],\"description\":\"Join us for a viewing \u0026 discussion of \\\"The Burning of Moses Seattle,\\\" a documentary about Chief Seattle's grandson, directed by Seattle author David Norman Lewis.\"},{\"id\":2884,\"name\":\"Asian Photography Association Exhibition\",\"title\":\"$undefined\",\"start_date\":\"2026-10-10 00:00:00\",\"end_date\":\"2026-10-11 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Asian Photography Association\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":1134,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2884_thumbnail_9d25d78fcde7a13f.jpg\"}],\"description\":\"Celebrate creativity, connection, and visual storytelling at the APA Photography Exhibition 📸\\r\\n\\r\\nPresented by the Asian Photography Association, this community exhibition brings together photographers from diverse backgrounds and features everything from sports, landscapes, and wildlife to portraits, street photography, and cultural storytelling.\\r\\n\\r\\nCome experience new perspectives and celebrate photography and the arts in Seattle.\"},{\"id\":3042,\"name\":\"Fernando Ferrarone Jazz Quartet\",\"title\":\"$undefined\",\"start_date\":\"2026-10-10 00:00:00\",\"end_date\":\"2026-10-10 23:59:59\",\"event_type\":\"Music\",\"neighborhood\":\"queen_anne\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Fountainhead Gallery\",\"street\":\"625 W McGraw St\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98119\",\"id\":127,\"lat\":\"47.63945850\",\"lon\":\"-122.36610840\",\"neighborhood\":\"queen_anne\",\"main_photo\":\"/art/photos/organizations/127_thumbnail_70effbb4592ec101.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3042_thumbnail_aad31bc921e6c9e3.jpg\"}],\"description\":\"As heard on KNKX 88.5, award-winning trumpeter, saxophonist, and composer Fernando Ferrarone performs music from his upcoming album, Travel With Me, and his debut release, Now Till Forever. He is joined by bassist Bob Bruya, drummer Sam Hart, and pianist Russell Kranes for an afternoon of original contemporary jazz. The ticketed concert begins promptly at 4 p.m. and runs until approximately 5:30–6 p.m., with a brief intermission. Children ages 6–12 attend free with advance notice; children under 6 are not permitted.\"},{\"id\":2432,\"name\":\"Jeff Goldblum \u0026 the Mildred Snitzer Orchestra with the Seattle Symphony\",\"title\":\"$undefined\",\"start_date\":\"2026-10-11 00:00:00\",\"end_date\":\"2026-10-11 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Symphony\",\"street\":\"Benaroya Hall, 200 University St. \",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":295,\"lat\":\"47.60817500\",\"lon\":\"-122.33676390\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/295_thumbnail_7a1b76264b000786.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2432_thumbnail_449e47d0f92be00e.jpg\"}],\"description\":\"Join Jeff Goldblum and The Mildred Snitzer Orchestra for a one-night-only performance with the Seattle Symphony, featuring orchestral arrangements of jazz favorites, American Songbook classics and music from their latest album, Night Blooms. Expect an evening of exceptional music and the signature charm that has made Goldblum a beloved entertainer.\"},{\"id\":2887,\"name\":\"Seattle Interactive Conference 2026\",\"title\":\"$undefined\",\"start_date\":\"2026-10-12 00:00:00\",\"end_date\":\"2026-10-13 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Seattle Interactive\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":700,\"lat\":\"38.79459520\",\"lon\":\"-106.53483790\",\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2887_thumbnail_8924ef74795449c6.jpg\"}],\"description\":\"Get ready for the return of the Seattle Interactive Conference 2026 at The Art Love Salon in Downtown Seattle, WA.\\r\\n\\r\\nSeattle Interactive Conference 2026\\r\\n\\r\\nJoin us for the Seattle Interactive Conference 2026, a must-attend event for all tech enthusiasts, creatives, and digital marketers. This in-person gathering will be held at the The Art Love Salon gallery, located at 110 Union Street, 5th Floor, Seattle, WA 98101.\\r\\n\\r\\nGet ready to immerse yourself in a vibrant atmosphere filled with innovative ideas, inspiring talks, and networking opportunities. Discover the latest trends in technology, web design, and digital marketing while connecting with industry leaders and like-minded professionals. Don't miss out on this exciting event that promises to ignite your creativity and expand your horizons.\\r\\n\\r\\nMark your calendars now and be part of the Seattle Interactive Conference 2026!\"},{\"id\":1331,\"name\":\"Weekly Tai Chi \u0026 Qigong in the Park                    \",\"title\":\"$undefined\",\"start_date\":\"2026-10-13 00:00:00\",\"end_date\":\"2026-10-13 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\":\"110 Union Street, 5th floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":462,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/462_thumbnail_2053695641081a34.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1331_thumbnail_c22f511259c3ba83.jpg\"}],\"description\":\"$24\"},{\"id\":1332,\"name\":\"Weekly Tai Chi \u0026 Qigong in the Park                     \",\"title\":\"$undefined\",\"start_date\":\"2026-10-13 00:00:00\",\"end_date\":\"2026-10-13 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\":\"110 Union Street, 5th floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":462,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/462_thumbnail_2053695641081a34.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1332_thumbnail_f2501de7652faf7b.jpg\"}],\"description\":\"$25\"},{\"id\":2874,\"name\":\"Boren Banner Series: Blake Blanco\",\"title\":\"$undefined\",\"start_date\":\"2026-10-14 00:00:00\",\"end_date\":\"2027-04-18 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Frye Art Museum\",\"street\":\"704 Terry Ave\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":30,\"lat\":\"47.60713240\",\"lon\":\"-122.32415380\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/30_thumbnail_1abc78e37a3b9ea4.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2874_thumbnail_cdeeb7ae3f91070f.jpg\"}],\"description\":\"Classical mythology meets the digital age in Seattle artist Blake Blanco’s Boren Banner. Working first in a virtual reality studio, Blanco creates digital sketches that he then translates into paint on canvas. In this new work developed for the Frye, Blanco takes inspiration from the Italian Renaissance engraving Danae and the infant Perseus cast out to sea by Acrisius (1543). The artist expressively distills his subjects into simplified shapes whose vivid synthetic colors suggest a plastic, rather than organic, world. The project extends Blanco’s ongoing inquiry into what it means to be human in a moment when the boundaries between the natural and the manufactured are increasingly unstable.\"},{\"id\":2571,\"name\":\"Jodi Picoult: Hollow Bones\",\"title\":\"$undefined\",\"start_date\":\"2026-10-14 00:00:00\",\"end_date\":\"2026-10-14 23:59:59\",\"event_type\":\"Literature\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Town Hall Seattle\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":594,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2571_thumbnail_1bf184e3c7e8d5cb.jpg\"}],\"description\":\"Author Jodi Picoult discusses her new novel Hollow Bones, exploring family, protection, and risk in an uncertain world. Part of Town Hall Seattle’s Oculus Series.\"},{\"id\":3143,\"name\":\"The Making of Terra Nostra, a multimedia creation about climate change\",\"title\":\"$undefined\",\"start_date\":\"2026-10-14 00:00:00\",\"end_date\":\"2026-10-14 23:59:59\",\"event_type\":\"Internal Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Earth Creative\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":578,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3143_thumbnail_add74fed65f61e4f.jpg\"}],\"description\":\"TERRA NOSTRA\\r\\n\\r\\nA 30-Minute Multimedia Symphony About Our Earth\\r\\n\\r\\nEarth Creative Flagship Production:\\r\\n\\r\\nTerra Nostra\\r\\n\\r\\nTerra Nostra is an emotionally powerful 30-minute, multimedia creative work that weaves music, film, and the spoken word to engage, educate, inspire, and empower viewers to take their place in the protection of our Earth. Composed by Christophe Chagnard, with poetry by Emily Siff, and cinematography by Charlie Spears, the original symphonic production of Terra Nostra premiered in 2015 to critical acclaim and has evolved in the intervening years to become the multiple award-winning production it is today.\\r\\n\\r\\nFor Climate Week NYC 2021, Terra Nostra will integrate new voices to help tell the story of climate change, with Greta Thunberg, Xiye Bastida and Ayisha Siddiqa reading Emily Siff’s poem, Turning Back.\"},{\"id\":2442,\"name\":\"Holland Andrews and yuniya edi kwon - How does it feel to look at nothing\",\"title\":\"$undefined\",\"start_date\":\"2026-10-15 00:00:00\",\"end_date\":\"2026-10-17 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"On the Boards\",\"street\":\"100 W Roy St.\",\"city\":\"Seattle\",\"state_code\":\"Wa\",\"zip\":\"98119\",\"id\":218,\"lat\":\"47.62593410\",\"lon\":\"-122.35821230\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/218_thumbnail_180636e527a67f5c.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2442_thumbnail_fa58cd187e2472b6.jpg\"}],\"description\":\"How does it feel to look at nothing is an experimental opera blending composition, improvisation, movement and ritual to explore transformation, identity and the emergence of meaning from decay. Created and performed by Holland Andrews and yuniya edi kwon, this interdisciplinary work weaves together sound, spirituality and embodied storytelling in a deeply personal exploration of queer possibility and becoming.\"},{\"id\":1567,\"name\":\"Private Event \",\"title\":\"$undefined\",\"start_date\":\"2026-10-15 00:00:00\",\"end_date\":\"2026-10-15 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"ArtLove Salon\",\"street\":\"110 Union Street, 5th Floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":808,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/808_thumbnail_a4e52b9a3896bdd9.jpg\"},\"photos\":[],\"description\":\"Note: This is a private event. \"},{\"id\":3687,\"name\":\"THIRD THURSDAY: Life Drawing Session\",\"title\":\"$undefined\",\"start_date\":\"2026-10-15 00:00:00\",\"end_date\":\"2026-10-15 23:59:59\",\"event_type\":\"Workshop\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3687_thumbnail_cb5f5311f49d5680.jpg\"}],\"description\":\"Join us for Third Thursday Life Drawing, a new Occidental Fine Arts initiative offering local artists the opportunity to draw and paint from a live model for FREE. Sessions feature a variety of models, poses, and attire, and artists of all styles and experience levels are welcome.\\r\\n\\r\\nApply online to participate. If accepted, there is no cost to attend, and basic art materials will be provided. Artists are also encouraged to bring their own materials so they can work in their preferred medium and style.\"},{\"id\":2433,\"name\":\"Etudes and Devotions\",\"title\":\"$undefined\",\"start_date\":\"2026-10-16 00:00:00\",\"end_date\":\"2026-10-16 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Symphony\",\"street\":\"Benaroya Hall, 200 University St. \",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":295,\"lat\":\"47.60817500\",\"lon\":\"-122.33676390\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/295_thumbnail_7a1b76264b000786.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2433_thumbnail_d59d5411353286d2.jpg\"}],\"description\":\"Discover the music of Seattle composer Samuel Adams in this Octave 9 Series concert featuring pianist Conor Hanick, percussionist Mari Yoshinaga and Seattle Symphony musicians. The program includes Adams' new Etudes and the U.S. premiere of Devotions, blending electronics, percussion and strings in an innovative chamber performance.\"},{\"id\":2476,\"name\":\"Neha and Neel\",\"title\":\"$undefined\",\"start_date\":\"2026-10-16 00:00:00\",\"end_date\":\"2026-11-08 23:59:59\",\"event_type\":null,\"neighborhood\":\"green_lake\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Public Theater\",\"street\":\"\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":291,\"lat\":\"38.79459520\",\"lon\":\"-106.53483790\",\"neighborhood\":\"green_lake\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2476_thumbnail_7e3c25015cc6e100.jpg\"}],\"description\":\"Seattle Public Theater and Pratidhwani co-produce Neha \u0026 Neel, a heartfelt new play by Ankita Raturi about family, identity, and cultural connection. As Neha worries she has lost the chance to pass her heritage on to her teenage son, a college visit becomes an opportunity to rediscover their shared history. This thoughtful story explores generational bonds, the meaning of belonging, and the lasting importance of staying connected to our roots.\"},{\"id\":3145,\"name\":\"O- Zine Release and Runway Showcase\",\"title\":\"$undefined\",\"start_date\":\"2026-10-16 00:00:00\",\"end_date\":\"2026-10-16 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"MACK\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":1183,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3145_thumbnail_6289e3d18b869fb9.jpg\"}],\"description\":\"Note: This is a partner event. Please visit the URL for ticket purchase. \\r\\n\\r\\nThis project, titled o-, is an omnigender apparel collection that will debut through a runway show and accompanying fashion zine. The event is designed to celebrate and strengthen Seattle’s fashion community while creating paid opportunities for local queer artists and models. The collection will be professionally photographed and featured in a fashion zine, which will be distributed to guests at the runway show. \\r\\n\\r\\nWhile the long-term goal is to grow the brand commercially, this event is centered on creative collaboration, community visibility, and sharing proceeds with the artists who help bring the project to life.\"},{\"id\":2434,\"name\":\"The 8-Bit Big Band with the Seattle Symphony\",\"title\":\"$undefined\",\"start_date\":\"2026-10-16 00:00:00\",\"end_date\":\"2026-10-16 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Symphony\",\"street\":\"Benaroya Hall, 200 University St. \",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":295,\"lat\":\"47.60817500\",\"lon\":\"-122.33676390\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/295_thumbnail_7a1b76264b000786.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2434_thumbnail_4c75abb2cf360464.jpg\"}],\"description\":\"The 8-Bit Big Band joins the Seattle Symphony for a high-energy concert celebrating iconic video game music with bold symphonic jazz arrangements. Experience beloved gaming soundtracks reimagined by the multi-GRAMMY-winning ensemble in a one-of-a-kind live performance.\"},{\"id\":3167,\"name\":\"Friends of Pike Place Market: Talk \u0026 Tour of the Pike Place Market\",\"title\":\"$undefined\",\"start_date\":\"2026-10-17 00:00:00\",\"end_date\":\"2026-10-17 23:59:59\",\"event_type\":\"Internal Event\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Conru Foundation\",\"street\":\"110 Union Street, Suite 400\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98121\",\"id\":1,\"lat\":\"47.60782530\",\"lon\":\"-122.33911480\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/1_thumbnail_14851f2f20333e70.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3167_thumbnail_84ab80ccaed805c3.jpg\"}],\"description\":\"Please join us for an intimate talk with Sandra Bown and Heather Phil, board members of the Friends of Pike Place Market, as they share the market's colorful history and lead us on a tour of its top stops.\"},{\"id\":1420,\"name\":\"Gentle Yoga + Sound Bath \",\"title\":\"$undefined\",\"start_date\":\"2026-10-17 00:00:00\",\"end_date\":\"2026-10-17 23:59:59\",\"event_type\":\"Workshop\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\"
