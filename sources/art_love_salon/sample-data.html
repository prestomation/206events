<script>self.__next_f.push([1,"ojo|-|ólǫ́ is an exhibition of recent and newly commissioned work by Diné artist Eric-Paul Riege (b. 1994, Na’nízhoozhí [Gallup, New Mexico]) that includes sculpture, textile, collage, and video, activated by moments of performance. Across this work, Riege combines customary Diné practices of weaving, silversmithing, and beading with contemporary cultural forms, exploring Diné cosmology, the history of Euro-American trading posts in and adjacent to the Navajo Nation, and the notion of “authenticity” as a value marker of Indigenous art and craft.\r\n\r\nDeveloped in partnership between the Henry and The Bell Gallery at Brown University, ojo|-|ólǫ́ emerged from Riege’s material research with Navajo collections housed at Brown’s Haffenreffer Museum of Anthropology and the University of Washington’s Burke Museum of Natural History and Culture. The resulting body of work celebrates the ancestral knowledge and labor contained within Indigenous-made objects, while investigating the role of museums and other institutions in the dissemination and dispossession of knowledge about Indigenous cultures. For his tactile and modular soft sculptures, Riege employs exaggerated scale and combines synthetic and natural materials to playfully question ideas of authenticity and Indigenous artistic production. Processes of making and remaking embody a living practice of exchange that draws together webs of connection across time and space.\r\n\r\nThe exhibition also includes objects from the Burke collection displayed alongside assorted personal collections from Riege’s own home and studio. The resulting non-hierarchal display blurs lines between past and present, private and public, and real and fake, animating the dynamism and dimensionality of Indigenous cultures and identities. ojo|-|ólǫ́ invites collective reflection on the practices of institutions that have accumulated Indigenous art, while advancing a call for Indigenous cultural resurgence in the present and toward our shared future.\r\n"])</script>

<script>self.__next_f.push([1,"\r\nThis course is designed as an accessible and exploratory introduction to alternative photographic processes. Over the quarter, students will engage with a diverse range of historical and experimental techniques including cyanotypes, anthotypes, alternative developers, and lumen prints. Each process will be introduced through hands-on demonstrations, practical exercises, discussions, and lectures exploring both historical and contemporary artists who integrate these approaches into their work. The primary goal of this course is to expand students’ creative practice and photographic vocabulary through direct experimentation with these processes. By the end of the quarter, students will develop an appreciation for the expressive possibilities of alternative photography, gaining both an introduction to technical skills and an understanding of alternative photographic processes place within the broader history and contemporary landscape of photographic art.\r\n\r\nCOURSE OBJECTIVES\r\n\r\nLearn how to mix cyanotype chemistry correctly and safely, how to apply cyanotype chemistry to various surfaces including but not limited to watercolor paper and fabric. Learn appropriate exposure and washing techniques for the cyanotype process\r\nLearn how to make plant-based emulsions to create anthotype prints and how to appropriately expose images, how to store prints in a light safe environment, and options for preserving anthotypes\r\nLearn how to make lumen prints, how to process prints, how to store prints in a light safe environment, and options for preserving lumen prints\r\nLearn how to create chemigrams using Vaseline, tape, honey, and cooking oils as well as how to process the prints using plant-based developers\r\nLearn how to create phytograms using 35mm film or B\u0026W darkroom paper\r\nBrief introduction to the history of alternative photography including discussions on contemporary practitioners and how they use experimental approaches to photography within their practice.\r\nCOURSE OUTCOMES\r\n\r\nFoundation of technical knowledge to successfully use the cyanotype, anthotype, phytogram, lumen printing, and chemigram techniques\r\nUnderstanding of core historical and contemporary art practitioners who utilize alternative photographic processes\r\nExperience participating in critique and exploring artistic vision\r\nAbility to apply basic alternative photographic techniques, knowledge and vocabulary within a personal practice\r\nCOURSE MATERIALS\r\nThe Materials Fee for the course covers the majority of supplies that students will use both in class and to complete assignments, including the various chemicals, digital negative media, watercolor paper, and black and white papers used for the different printing processes. Students may incur some additional materials costs should they wish to go above and beyond or explore a particular process in more depth outside of the course requirements. See the Important Notes for Students section below for details about facilities access and rental fees."])</script>

<script>self.__next_f.push([1,"Free two-hour workshops exploring charcoal drawing alongside Pacific Northwest trees. Each week, a different tree and a finished drawing.\r\n\r\nWeekly Tree Studies\r\n\r\nThis series invites you to slow down and actually look at the trees around you. Douglas Firs. Madrones. Bigleaf Maples. Red Alders. We study their structure, their light, their character through charcoal.\r\n\r\nEach workshop stands alone. Come for one session or return for all eight to build your tree visual library.We will focus on proportion and branching, textural depth through bark and lichen and ultimately landscapes with multiple trees in space.\r\n\r\nYou'll learn charcoal powder wash for atmospheric tone, reductive erasing to carve light from shadow, and how to render organic texture without lines. Through demonstration and guided work, you'll translate observation into confident mark-making.\r\n\r\nBy session's end, you'll have a finished 9x12 charcoal drawing. All levels welcome; no experience necessary. We provide materials, instruction, and space to work.\r\n\r\nAbout The instructor:\r\nGarima Tripathi is an Indian visual artist and Buddhist meditator working across ceramics, community-led installations, drawing, and printmaking. Tripathi’s training includes traditional potters in Mumbai, an MFA from the University of Oxford as a Charles Wallace India Trust Scholar. She also holds a Post-Graduate Diploma in Buddhist Analysis of Mind and completed post-baccalaureate studies at the School of the Museum of Fine Arts, Boston. She has created permanent public installations at Anneberg Kulturpark in Denmark, Harvard University, and IIT Bombay. Since moving to Seattle in 2024, she has focused on Project MoTAI (Mother Trees for Asian Immigrants), a community-centered initiative. "])</script>

<script>self.__next_f.push([1,"Note: This is a partner event. Please visit the URL to RSVP.\r\n\r\nIMMINENT MODE is Seattle's premier wearable art show, focusing on supporting creators from the City's vibrant arts community.\r\n\r\nIMMINENT MODE: Evolution\r\nIt has been said that desperate times call for desperate measures; Oftentimes, adaptation simply isn’t enough. In order to survive, we must evolve.\r\n\r\nIn our seventh cycle, IMMINENT MODE: Evolution brings you six teams comprised of a Garment Designer and Fine Artist to tell their story of evolution through wearable art, installation, and runway.\r\n\r\nFeaturing the talents of\r\nAnouk Rawkson, Jordan Christianson, Shiloh Davies, Shari Noble, Brandon Vosika, Jersey Virago, Dez'Mon Fair, Mariel Andrade, Devon Yan, Brendan Olsen, Ruben David Rodgriguez, and Debora Spencer.\r\n\r\nGeneriously brought to you and sponsored by\r\nPublicDisplay.ART, the Conru Art Foundation, Northwest Film Forum, and PINK HALLOWEEN\r\n\r\nHeader image credits\r\nPhotography: Debora Spencer, Model: Ade Connere, Garment: Jordan Christianson + Anouk Rawkson"])</script>

<script>self.__next_f.push([1,"Free two-hour workshops exploring charcoal drawing alongside Pacific Northwest trees. Each week, a different tree and a finished drawing.\r\n\r\nWeekly Tree Studies\r\n\r\nThis series invites you to slow down and actually look at the trees around you. Douglas Firs. Madrones. Bigleaf Maples. Red Alders. We study their structure, their light, their character through charcoal.\r\n\r\nEach workshop stands alone. Come for one session or return for all eight to build your tree visual library.We will focus on proportion and branching, textural depth through bark and lichen and ultimately landscapes with multiple trees in space.\r\n\r\nYou'll learn charcoal powder wash for atmospheric tone, reductive erasing to carve light from shadow, and how to render organic texture without lines. Through demonstration and guided work, you'll translate observation into confident mark-making.\r\n\r\nBy session's end, you'll have a finished 9x12 charcoal drawing. All levels welcome; no experience necessary. We provide materials, instruction, and space to work.\r\n\r\nAbout The instructor:\r\nGarima Tripathi is an Indian visual artist and Buddhist meditator working across ceramics, community-led installations, drawing, and printmaking. Tripathi’s training includes traditional potters in Mumbai, an MFA from the University of Oxford as a Charles Wallace India Trust Scholar. She also holds a Post-Graduate Diploma in Buddhist Analysis of Mind and completed post-baccalaureate studies at the School of the Museum of Fine Arts, Boston. She has created permanent public installations at Anneberg Kulturpark in Denmark, Harvard University, and IIT Bombay. Since moving to Seattle in 2024, she has focused on Project MoTAI (Mother Trees for Asian Immigrants), a community-centered initiative. "])</script>

<script>self.__next_f.push([1,"Art Love Salon is proud to sponsor this weekly mindful movement session inspired by Tai Chi and Qigong.\r\n\r\nJoin us each Tuesday for a gentle Tai Chi practice beginning at Pike Park, followed by an optional continuation at Art Love Salon.\r\nParticipants always meet at First \u0026 Pike Park at 12:00 PM, where instructor Karin Philomin begins with a 30-minute beginner-friendly warm-up practice focused on posture, balance, breath, and simple movements to calm the nervous system.\r\n\r\nAt 12:30 PM, the group walks together two blocks to Art Love Salon, where participants are welcome to warm up, use the restroom, enjoy a cup of coffee, and optionally continue practicing with a Yang Tai Chi 24-form sequence.\r\n\r\nIn case of rain or poor weather, please still meet at the park. The instructor will gather the group and lead everyone to Art Love Salon to continue the session indoors.\r\n\r\nWhen: Tuesdays at 12:00 PM\r\n12:00–12:30 PM: Tai Chi warm-up at First \u0026 Pike Park\r\n12:30–1:00 PM: Walk to Art Love Salon + optional indoor practice\r\nMeeting Point:\r\nFirst \u0026 Pike Park (across from Pike Place Market, between 1st \u0026 2nd)\r\n\r\nIndoor Partner \u0026 Sponsor:\r\nArt Love Salon\r\n110 Union St, 5th Floor, Seattle\r\n\r\nInstructor:\r\nKarin Philomin has been teaching Tai Chi and Qi Gong for over 25 years, leading community wellness practices throughout downtown Seattle including Westlake, South Lake Union, Occidental, and Hing Hay Park."])</script>

<script>self.__next_f.push([1,"Salon Social is ArtLove Salon’s weekly open gathering—an invitation to pause mid-week and step into a space shaped by art, music, and meaningful exchange.\r\n\r\nOn the first Wednesday of each month, we will feature a specially curated trio led by acclaimed Seattle drummer and bandleader D’Vonne Lewis, who will bring together a rotating lineup of musicians for evenings rooted in improvisation, collaboration, and the spirit of Seattle’s living jazz community.\r\n\r\nA celebrated performer, educator, and cultural force within the city’s music scene, D’Vonne is known for building spaces where musicians and audiences can connect through shared rhythm, experimentation, and joy. Each month’s trio and musical direction will shift organically, creating a new experience every gathering.\r\nBeyond the music, Salon Social remains an open invitation to gather—whether to listen closely, move through the galleries, meet someone new, or simply spend time surrounded by art and community.\r\n\r\nFeatured musicians and additional details to be announced.\r\n\r\n✨ Every first Wednesday | 4–7 PM\r\n✨ Free with RSVP. Refreshments provided."])</script>

<script>self.__next_f.push([1,"Doors and Reception 5:00 PM \r\n\r\nPerformance 5:30 PM-6:30 PM\r\n\r\nPost- Concert Reception 6:30 PM-7:00 PM\r\n\r\nFree with RSVP.  Light Refreshments Provided \r\n\r\nGlass House String Quartet will perform at the music soiree on October 8th.  \r\n\r\nhttps://glasshousestringquartet.com\r\n\r\n\r\n\r\nThe Glass House String Quartet\r\n\r\nViolin - Allion Salvador\r\n\r\nViolin- Vanessa Moss\r\n\r\nViola- Gerald Liu\r\n\r\nCello Lauren McShane \r\n\r\nThe Glass House String Quartet unites four longtime friends and collaborators—violinists Allion Salvador and Vanessa Moss, violist Gerald Liu, and cellist Lauren McShane—whose shared history spans a decade of music-making across the Pacific Northwest. \r\n\r\nTheir name honors the Glass House of Fern Grove on Vashon Island, a striking architectural space designed by Seth Grizzle and owned by Ruth True, where the quartet gave their first performance. With the Puget Sound to one side and forest on the other, that glowing space became both a home for the ensemble: a meeting place of artistry, friendship, and the natural world.\r\n\r\nPerformances of Glass House invite the audience to join them in the intimacy of chamber music. They create artistic experiences celebrating small communities, the natural beauty of the Pacific Northwest, and the love of family.\r\n\r\nCollectively, the members of the Glass House String Quartet perform with orchestras across Washington and beyond, teach and mentor the next generation of musicians, and champion chamber music as a space for shared listening and genuine human connection. Whether in a concert hall, a woodland glasshouse, or a small community gathering, their performances invite audiences into that same spirit of light, reflection, and joy."])</script>

<script>self.__next_f.push([1,"This monthly offering is part of a Healer in Residence program: a reimagining of the traditional artist residency that centers rest, embodiment, and nervous system care as essential cultural practices.\r\n\r\nLed by Sylvia Hadnot of Studio S.E.E. (Sound \u0026 Energy Embodiment), each session blends gentle, accessible yoga with an immersive sound bath. The experience begins with slow, grounding movement and breathwork designed to support regulation and ease in the body, and transitions into a deeply restful soundscape using crystal singing bowls, chimes, voice, and ambient sound.\r\n\r\nThese gatherings are intentionally unhurried. The yoga is low-impact and adaptable, with options to move at your own pace or rest as needed. The sound bath invites participants to lie down or sit comfortably, allowing sound to move through the body and space without effort or expectation.\r\n\r\nHealer in Residence honors the intersection of art and wellness, recognizing that just as artists shape how we see and feel the world, healing practices help us tend to the bodies and nervous systems that experience it.\r\n\r\nAll bodies are welcome. No prior yoga or sound bath experience is necessary. Please bring a yoga mat and a water bottle and dress to relax. \r\n\r\nRSVP required"])</script>
<script>self.__next_f.push([1,"5:[\"$\",\"$L1b\",null,{\"initialEvents\":[{\"id\":479,\"name\":\"Never Turn Back: Echoes of African American Music\",\"title\":\"$undefined\",\"start_date\":\"2025-05-17 00:00:00\",\"end_date\":\"2027-01-17 00:00:00\",\"event_type\":\"Art\",\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":null,\"org\":{\"name\":\"Museum of Pop Culture (MoPOP)\",\"street\":\"325 5th Ave N\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98109\",\"id\":279,\"lat\":\"47.62144660\",\"lon\":\"-122.34828290\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/279_thumbnail_1f058d7b8b00db60.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/479_thumbnail_3c2a40f919a7dd00.jpg\"}],\"description\":\"Never Turn Back: Echoes of African American Music unveils the profound legacy of Gospel, Blues, Jazz, and Soul artists who shaped the soundscape of American culture and used their music as instruments of resistance, identity, and representation.  \"},{\"id\":1188,\"name\":\"Jonathan Lasker: Drawings and Studies\",\"title\":\"$undefined\",\"start_date\":\"2026-03-01 00:00:00\",\"end_date\":\"2026-10-11 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Frye Art Museum\",\"street\":\"704 Terry Ave\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":30,\"lat\":\"47.60713240\",\"lon\":\"-122.32415380\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/30_thumbnail_1abc78e37a3b9ea4.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1188_thumbnail_1f1f52d75e3af7e3.jpg\"}],\"description\":\"Jonathan Lasker: Drawings and Studies offers a close look at how the artist's distinctive visual language comes to life through biomorphic forms and choreographed marks.\"},{\"id\":1176,\"name\":\"ojo|-|ólǫ́ \",\"title\":\"$undefined\",\"start_date\":\"2026-03-14 00:00:00\",\"end_date\":\"2026-10-25 23:59:59\",\"event_type\ ne of Alexander Calder’s last works, the distinctive Mountains (1:5 intermediate maquette, 1976), as a touchpoint for this exhibition. Like the vast majority of the legendary sculptor’s masterpieces, Mountains is black. Donovan explains, “My primary (though not sole) focus on the color black references Calder’s use of black in many of his works as a neutralizing force that flattens sculptural shapes.”\"},{\"id\":1487,\"name\":\"Tom Lloyd\",\"title\":\"$undefined\",\"start_date\":\"2026-05-16 00:00:00\",\"end_date\":\"2026-09-20 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Frye Art Museum\",\"street\":\"704 Terry Ave\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":30,\"lat\":\"47.60713240\",\"lon\":\"-122.32415380\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/30_thumbnail_1abc78e37a3b9ea4.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1487_thumbnail_7eeaae630e939ce8.jpg\"}],\"description\":\"Tom Lloyd highlights the pioneering work of artist and activist Tom Lloyd, an early innovator in the use of electronic light as an artistic medium. Bringing together sculptures, assemblages, and works on paper spanning two decades, the exhibition explores Lloyd’s groundbreaking fusion of art and technology alongside his lasting impact on artistic advocacy and community leadership.\"},{\"id\":1489,\"name\":\"Artists’ Choice\",\"title\":\"$undefined\",\"start_date\":\"2026-06-06 00:00:00\",\"end_date\":\"2026-10-11 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Frye Art Museum\",\"street\":\"704 Terry Ave\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":30,\"lat\":\"47.60713240\",\"lon\":\"-122.32415380\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/30_thumbnail_1abc78e37a3b9ea4.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1489_thumbnail_e49f25a9b374b72c.jpg\"}],\"description\":\"Artists’ Choice brings together selections from the Frye Art Museum’s collection, recontextualized by five Seattle-based creatives working across music, dance, poetry, theater, and visual art. Their contributions reflect themes of identity, memory, grief, and social critique, offering new perspectives on familiar works. The exhibition highlights how meaning shifts through interpretation, revealing artworks as living narratives shaped by those who engage with them.\"},{\"id\":1488,\"name\":\"Lotus L. Kang: I hear the hollow boom of time\",\"title\":\"$undefined\",\"start_date\":\"2026-06-06 00:00:00\",\"end_date\":\"2026-09-27 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Frye Art Museum\",\"street\":\"704 Terry Ave\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":30,\"lat\":\"47.60713240\",\"lon\":\"-122.32415380\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/30_thumbnail_1abc78e37a3b9ea4.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1488_thumbnail_22587265dabcb788.jpg\"}],\"description\":\"Lotus L. Kang presents immersive installations that explore photography through material experimentation and site responsiveness. Featuring film-based sculptures, kinetic light works, and works on paper, the exhibition reflects on memory, transformation, and the shifting boundaries between body, material, and environment.\"},{\"id\":1508,\"name\":\"The Blue Light Is A Promise\",\"title\":\"$undefined\",\"start_date\":\"2026-06-10 00:00:00\",\"end_date\":\"2026-10-31 23:59:59\",\"event_type\":null,\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"M. Rosetta Hunter Art Gallery\",\"street\":\"1701 Broadway\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98122\",\"id\":226,\"lat\":\"47.61672290\",\"lon\":\"-122.32159650\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/226_thumbnail_6e67f132885ff733.jpg\"},\"photos\":[],\"description\":\"More information to come...\"},{\"id\":1517,\"name\":\"PublicDisplay Gallery\",\"title\":\"$undefined\",\"start_date\":\"2026-06-11 00:00:00\",\"end_date\":\"2026-12-31 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"PublicDisplay: Gallery\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":653,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1517_thumbnail_5fe5f89cffdc32b2.jpg\"}],\"description\":\"Public Display: Gallery is an ongoing, ever-changing exhibit that showcases the work of featured and invited guest artists. If you like flipping through PublicDisplay.ART, you will love this exhibit.\"},{\"id\":1540,\"name\":\"DISplace\",\"title\":\"$undefined\",\"start_date\":\"2026-06-13 00:00:00\",\"end_date\":\"2027-01-04 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Wing Luke Museum\",\"street\":\"719 S. King Street Seattle\",\"city\":\"SEATTLE\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":34,\"lat\":\"47.59813680\",\"lon\":\"-122.32282860\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/34_thumbnail_b258676045460ba2.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1540_thumbnail_15cbed3a5f2a677f.jpg\"}],\"description\":\"Co-curated by Lehuauakea and Kanani Miyamoto, DISplace explores the histories and experiences connecting Hawaiʻi and the Pacific Northwest through art, family stories, photographs, and archival materials. Centering Native Hawaiian voices, the exhibition traces generations of movement, displacement, and cultural continuity. Through personal narratives and historical context, DISplace celebrates resilience, legacy, and the enduring meaning of home.\"},{\"id\":1465,\"name\":\"Cloth, Paper, Stitches\",\"title\":\"$undefined\",\"start_date\":\"2026-07-03 00:00:00\",\"end_date\":\"2026-09-20 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Bainbridge Island Museum of Art\",\"street\":\"550 Winslow Way E, Bainbridge Island, WA 98110\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":252,\"lat\":\"47.62514320\",\"lon\":\"-122.51452760\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/252_thumbnail_f49f33ec2d6c3f9d.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1465_thumbnail_7d1068538eabbcc6.jpg\"}],\"description\":\"Part of HANDWORK 2026 | Sherry Grover Gallery\\r\\nDrawn from the Cynthia Sears Artists’ Books Collection, Cloth, Paper, Stitches explores the creative possibilities of cloth, paper, and thread through artists’ books that incorporate sewing, weaving, cutting, and folding. Blending traditional handwork with experimental storytelling, the exhibition highlights material as a vehicle for care, connection, resilience, and transformation.\"},{\"id\":1504,\"name\":\"Helen Frankenthaler \\\"Every Picture Somewhat of an Experiment\\\"\",\"title\":\"$undefined\",\"start_date\":\"2026-07-05 00:00:00\",\"end_date\":\"2027-04-25 23:59:59\",\"event_type\":null,\"neighborhood\":\"university_district\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Henry Art Gallery\",\"street\":\"15th Ave NE \u0026 NE 41st St\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98196\",\"id\":691,\"lat\":\"47.65682300\",\"lon\":\"-122.31205670\",\"neighborhood\":\"university_district\",\"main_photo\":\"/art/photos/organizations/691_thumbnail_793b7618d50acdc3.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1504_thumbnail_77d10e52c6458649.jpg\"}],\"description\":\"An exhibition of prints by Helen Frankenthaler, highlighting her experimental approach to abstraction and her innovative work in printmaking alongside painting. The works trace her career from early experiments to later technical developments and emphasize collaboration and material exploration.\\r\\nThe exhibition also includes recent works by Analia Saban that continue themes of materiality, abstraction, and experimentation across traditional and emerging media.\\r\\n\"},{\"id\":1717,\"name\":\"Summer Visions: Play + Process - Opening Reception\",\"title\":\"$undefined\",\"start_date\":\"2026-07-16 00:00:00\",\"end_date\":\"2026-09-24 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Path with Arts \",\"street\":\"200 Mercer St. \",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98109\",\"id\":18,\"lat\":\"47.62473250\",\"lon\":\"-122.35244950\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/18_thumbnail_ea3e1c749259ed41.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1717_thumbnail_d87e1248f309454b.jpg\"}],\"description\":\"Art begins with curiosity and serves as a space for exploration, experimentation, and discovery. Play + Process: Summer Visions Exhibition celebrates the creative journey rather than just the finished result, reminding us that art is not only about what we create, but how we create it. Through diverse mediums including paint, ceramics, fabric, words, and sound, the works in this exhibition reflect moments of playful exploration and artistic freedom. \"},{\"id\":2422,\"name\":\"Korean Rhapsody: Sijo at Gallery B612\",\"title\":\"$undefined\",\"start_date\":\"2026-07-23 00:00:00\",\"end_date\":\"2026-09-30 23:59:59\",\"event_type\":null,\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Gallery B612\",\"street\":\"1915 1st Ave. S.\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":285,\"lat\":\"47.58547620\",\"lon\":\"-122.33471500\",\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/organizations/285_thumbnail_1bff5b962472fcc7.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2422_thumbnail_8c373b01a9c1ed81.jpg\"}],\"description\":\"Korean Rhapsody: Sijo brings together works by MiYoung Margolis, KyoungMug Park, and YoungHwa Choi, inspired by the traditional Korean poetic form sijo and its themes of nature, emotion, and reflection. On view July 23–September 30, the exhibition reimagines Korean artistic traditions through ink, hanji, and mixed media as part of Korean Cultural Week 2026.\"},{\"id\":1505,\"name\":\"Joiri Minaya: To Hell With Hibiscus\",\"title\":\"$undefined\",\"start_date\":\"2026-07-25 00:00:00\",\"end_date\":\"2027-05-02 23:59:59\",\"event_type\":null,\"neighborhood\":\"university_district\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Henry Art Gallery\",\"street\":\"15th Ave NE \u0026 NE 41st St\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98196\",\"id\":691,\"lat\":\"47.65682300\",\"lon\":\"-122.31205670\",\"neighborhood\":\"university_district\",\"main_photo\":\"/art/photos/organizations/691_thumbnail_793b7618d50acdc3.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1505_thumbnail_65d9e303c24ac18c.jpg\"}],\"description\":\"An exhibition by Joiri Minaya exploring the Tropics as a constructed identity shaped by colonial narratives. Through textiles and installation, the work reclaims Afro-Indigenous histories and challenges stereotypes tied to tropical geographies.\\r\\nThe exhibition uses fabric-based works to question cultural representation and invites reflection on shared histories across the global South.\\r\\n\"},{\"id\":2636,\"name\":\"What's the Story?\",\"title\":\"$undefined\",\"start_date\":\"2026-08-06 00:00:00\",\"end_date\":\"2026-09-19 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"ArtX Contemporary\",\"street\":\"512 1st Ave S\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":104,\"lat\":\"47.59785640\",\"lon\":\"-122.33392960\",\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/organizations/104_thumbnail_0d05cfe8c8a07739.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2636_thumbnail_ba2aff73e41e0acd.jpg\"}],\"description\":\"ArtX Contemporary presents a group exhibition featuring six regional artists exploring heritage, history, homeland, and culture through the human figure. Their diverse approaches consider the body as a site of identity, memory, belonging, and connection. The exhibition includes work by Lauren Iida alongside five other regional artists, creating a dialogue around contemporary figurative art and representation.\"},{\"id\":2459,\"name\":\"PHONELESS FRIDAYS/SCREENLESS SATURDAYS\",\"title\":\"$undefined\",\"start_date\":\"2026-08-07 00:00:00\",\"end_date\":\"2026-10-24 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Asylum Collective\",\"street\":\"108 S Jackson St Ste B Seattle, WA 98104\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":1050,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2459_thumbnail_965539e6e764e602.jpg\"}],\"description\":\"Phoneless Fridays at Asylum invites guests to unplug, make something, and reconnect with the world around them. This free weekly open studio night offers access to a full maker space filled with art supplies, tools, and creative resources—from sewing and painting to sculpture, music, and more. Guests can check in their phones at the door, enjoy affordable drinks, and spend the evening creating, chatting, or simply taking a break from the digital noise. Bring a project, try something new, or just come recharge in a space built for creativity and community.\"},{\"id\":1471,\"name\":\"Self. Reflexive.\",\"title\":\"$undefined\",\"start_date\":\"2026-08-15 00:00:00\",\"end_date\":\"2026-09-27 23:59:59\",\"event_type\":null,\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"AMcE Creative Arts\",\"street\":\"612 19th Avenue E\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98112\",\"id\":85,\"lat\":\"47.62478320\",\"lon\":\"-122.30708190\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/85_thumbnail_ba728e95152acbe8.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1471_thumbnail_e06e6752adf94a2c.jpg\"}],\"description\":\"A collection of abstract paintings exploring the intersection of inner experience and collective consciousness. Featuring Ian Brownlee, Gegam Kacherian, Kaoru Mansour, and Michael Lazarus, the exhibition brings together artists from Seattle, Portland, and Los Angeles in a shared dialogue of reflection, intuition, and connection.\"},{\"id\":3105,\"name\":\"UNITE: A BIPOC IMPROV JAM - Every Wednesday\",\"title\":\"$undefined\",\"start_date\":\"2026-08-25 00:00:00\",\"end_date\":\"2026-12-31 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Langston\",\"street\":\"104 17th Ave S. \",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98144\",\"id\":62,\"lat\":\"47.60133850\",\"lon\":\"-122.30984700\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/62_thumbnail_fb81d807b576dfc6.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3105_thumbnail_1f6e6b2a3a50ddc1.jpg\"}],\"description\":\"Unite is a free, welcoming improv jam for BIPOC participants at the Langston Hughes Performing Arts Institute. Through playful games and creative exercises incorporating music, movement, and poetry, participants of all experience levels can take artistic risks, connect, and explore spontaneous storytelling. No improv experience is needed—just an open mind. Admission is free with registration.\\r\\n\"},{\"id\":2475,\"name\":\"Jurassic Parking Lot\",\"title\":\"$undefined\",\"start_date\":\"2026-08-27 00:00:00\",\"end_date\":\"2026-09-27 23:59:59\",\"event_type\":null,\"neighborhood\":\"green_lake\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Seattle Public Theater\",\"street\":\"\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":291,\"lat\":\"38.79459520\",\"lon\":\"-106.53483790\",\"neighborhood\":\"green_lake\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2475_thumbnail_8e77965831d01b45.jpg\"}],\"description\":\"Seattle Public Theater and The Habit co-produce Jurassic Parking Lot, a hilarious blockbuster parody from the creators of A Very Die Hard Christmas and Titanish. Packed with outrageous comedy, live music, dinosaurs, and over-the-top theatrical chaos, this fast-paced production delivers a wildly entertaining adventure. Perfect for audiences who enjoy irreverent humor and never fully left their inner child behind, Jurassic Parking Lot is recommended for ages 14 and up.\\r\\n\"},{\"id\":1511,\"name\":\"A solo Exhibition by Hank Reavis\",\"title\":\"$undefined\",\"start_date\":\"2026-08-28 00:00:00\",\"end_date\":\"2026-09-27 23:59:59\",\"event_type\":null,\"neighborhood\":\"georgetown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Mini Mart City Park\",\"street\":\"6525 Ellis Ave S\",\"city\":\"Seattle/Georgetown\",\"state_code\":\"WA\",\"zip\":\"98108\",\"id\":97,\"lat\":\"47.54415840\",\"lon\":\"-122.31920830\",\"neighborhood\":\"georgetown\",\"main_photo\":\"/art/photos/organizations/97_thumbnail_197ff4b19489767f.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1511_thumbnail_c37de02df4c05ba8.jpg\"}],\"description\":\"More information to come.\"},{\"id\":3524,\"name\":\"Blood/Sucker\",\"title\":\"$undefined\",\"start_date\":\"2026-08-28 00:00:00\",\"end_date\":\"2026-09-25 23:59:59\",\"event_type\":null,\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"12th Avenue Arts\",\"street\":\"1620 12th Ave, Seattle, WA 98122\",\"city\":\"\",\"state_code\":\"\",\"zip\":\"\",\"id\":251,\"lat\":\"47.61572560\",\"lon\":\"-122.31650300\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/251_thumbnail_4c217228f5c1f6a1.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3524_thumbnail_c419e5ea45f2418f.jpg\"}],\"description\":\"BLOOD/SUCKER is a chilling horror play that examines the public school system through Filipino mythology. After a doxxing campaign threatens his Asian American History class, teacher Ryan fights to save the program while Principal Hillary faces a difficult decision. As something bloodthirsty stirs within the school’s walls and students begin behaving strangely, the battle over education takes a terrifying turn.\"},{\"id\":1618,\"name\":\"KELLIE TALBOT NEW WORKS\",\"title\":\"$undefined\",\"start_date\":\"2026-08-29 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Patricia Rovzar Gallery\",\"street\":\"1111 1st Ave.\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":227,\"lat\":\"38.79459520\",\"lon\":\"-106.53483790\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1618_thumbnail_8180192b3d74d9d9.jpg\"}],\"description\":\"Experience the evocative paintings of artist Talbot, whose work celebrates the beauty of America's historic landscapes, architecture, craftsmanship, and everyday artifacts. Through richly textured oil paintings, she reveals the resilience, history, and enduring spirit found in weathered places and objects, reflecting a deep connection to time, memory, and place.\"},{\"id\":2877,\"name\":\"A Touch of Architecture\",\"title\":\"$undefined\",\"start_date\":\"2026-09-01 00:00:00\",\"end_date\":\"2026-09-30 23:59:59\",\"event_type\":null,\"neighborhood\":\"west_seattle\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Alki Arts\",\"street\":\"6030 California Ave SW\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98136\",\"id\":237,\"lat\":\"47.54750970\",\"lon\":\"-122.38683750\",\"neighborhood\":\"west_seattle\",\"main_photo\":\"/art/photos/organizations/237_thumbnail_990dbe198af8831a.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2877_thumbnail_e7b01a3b265cbff9.jpg\"}],\"description\":\"A Touch of Architecture features Leon Lowman, Garreth Schuh, Jay Lazerwitz, Joanne Shellan, and Reeve Washburn, bringing together art inspired by architecture, interior spaces, and mid-century modern design.\"},{\"id\":3045,\"name\":\"ACES: Artists of Color Expo \u0026 Symposium\",\"title\":\"$undefined\",\"start_date\":\"2026-09-01 00:00:00\",\"end_date\":\"2026-09-30 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Shunpike\",\"street\":\"PO BOX 2243\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98122\",\"id\":4,\"lat\":\"47.65964100\",\"lon\":\"-122.31282680\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/4_thumbnail_526ef01ad457d4af.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3045_thumbnail_9b44d944a3f59f01.jpg\"}],\"description\":\"Presented by Shunpike, the Artists of Color Expo \u0026 Symposium (ACES) celebrates artists of color across the Seattle region. The month-long September event features exhibitions, performances, workshops, and discussions. ACES explores identity, representation, and equity in the arts. It also builds connections throughout Seattle’s creative community.\"},{\"id\":2870,\"name\":\"Sole Perspective featuring Raelene Plant\",\"title\":\"$undefined\",\"start_date\":\"2026-09-02 00:00:00\",\"end_date\":\"2026-09-30 23:59:59\",\"event_type\":null,\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Gray Sky Gallery\",\"street\":\"320 1st Ave S\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":111,\"lat\":\"47.59941340\",\"lon\":\"-122.33385610\",\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/organizations/111_thumbnail_517880b398d03237.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2870_thumbnail_c72244cfd1f3ebe4.jpg\"}],\"description\":\"Seattle-based oil painter Raelene Plant presents fragmented figure paintings focused on shoes, inviting viewers to imagine the person and discover their own stories within the work.\"},{\"id\":2879,\"name\":\"DAPHNE MINKOFF- Edges of Unmaking\",\"title\":\"$undefined\",\"start_date\":\"2026-09-03 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown_seattle\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Harris Harvey Gallery\",\"street\":\"1915 1st Ave\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98101\",\"id\":92,\"lat\":\"47.61051140\",\"lon\":\"-122.34198620\",\"neighborhood\":\"downtown_seattle\",\"main_photo\":\"/art/photos/organizations/92_thumbnail_5c563698ef24b119.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2879_thumbnail_8158e6904ee3d8d5.jpg\"}],\"description\":\"In Edges of Unmaking, Daphne Minkoff explores memory, place, and loss through mixed-media paintings of urban landscapes in transition. Drawing on disappearing houses, storefronts, structures, and automobiles, her work considers what remains when familiar spaces vanish.\"},{\"id\":3077,\"name\":\"Fauna Aquatica: On Fluid Existence\",\"title\":\"$undefined\",\"start_date\":\"2026-09-03 00:00:00\",\"end_date\":\"2026-10-28 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Gallery B612\",\"street\":\"1915 1st Ave. S.\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":285,\"lat\":\"47.58547620\",\"lon\":\"-122.33471500\",\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/organizations/285_thumbnail_1bff5b962472fcc7.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3077_thumbnail_764ba85c400f6db6.jpg\"}],\"description\":\"Fauna Aquatica: On Fluid Existence brings together 18 contemporary artists exploring marine life and underwater environments. Through painting, mixed media, and other techniques, the exhibition celebrates the beauty, mystery, and strangeness of ocean life. The works also reflect on the vital role marine ecosystems play in sustaining the planet.\"},{\"id\":2420,\"name\":\"ILANA ZWESCHI - Look Upon This Body As A Machine\",\"title\":\"$undefined\",\"start_date\":\"2026-09-03 00:00:00\",\"end_date\":\"2026-09-19 23:59:59\",\"event_type\":null,\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Foster/White Gallery\",\"street\":\"220 3rd Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":108,\"lat\":\"47.60025570\",\"lon\":\"-122.32989270\",\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/organizations/108_thumbnail_acc9ed7bc97e0123.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2420_thumbnail_9b25eb7dc8e64c84.jpg\"}],\"description\":\"Look Upon This Body As A Machine is Ilana Zweschi's second solo exhibition with the gallery, featuring abstract paintings that combine handwritten algorithms with expressive painting to explore the intersection of mathematics and art. Meet the artist at the opening reception on September 3, 6–8 pm, and join an artist talk on September 5 at noon; the exhibition is on view through September 19.\"},{\"id\":2765,\"name\":\"Michael Schultheis: Coherence in Chaos\",\"title\":\"$undefined\",\"start_date\":\"2026-09-03 00:00:00\",\"end_date\":\"2026-10-17 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Winston Wächter Fine Art\",\"street\":\"203 Dexter Ave N\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98109\",\"id\":229,\"lat\":\"47.61987780\",\"lon\":\"-122.34280090\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/229_thumbnail_a9c06715d5fcd855.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2765_thumbnail_44c2b50408639eae.jpg\"}],\"description\":\"Winston Wächter Fine Art celebrates 20 years of collaboration with Seattle artist Michael Schultheis in Coherence in Chaos. The exhibition features his latest acrylic works, inspired by the mathematical form of the epicycloid. Schultheis explores connection, relationships, and the forces that hold us together. His work is held in major collections and has been exhibited internationally.\\r\\n\"},{\"id\":2714,\"name\":\"Michele Rushworth: Splash of Light\",\"title\":\"$undefined\",\"start_date\":\"2026-09-03 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"queen_anne\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Fountainhead Gallery\",\"street\":\"625 W McGraw St\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98119\",\"id\":127,\"lat\":\"47.63945850\",\"lon\":\"-122.36610840\",\"neighborhood\":\"queen_anne\",\"main_photo\":\"/art/photos/organizations/127_thumbnail_70effbb4592ec101.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2714_thumbnail_63480e5b3af06226.jpg\"}],\"description\":\"Fountainhead Gallery will present Michele Rushworth’s vibrant oil paintings in an upcoming exhibition inspired by the light, water, and landscapes of the Pacific Northwest. More information about the exhibit is coming soon, including details about the September 12 opening reception. \"},{\"id\":3082,\"name\":\"Shifting Light\",\"title\":\"$undefined\",\"start_date\":\"2026-09-03 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Chatwin Arts\",\"street\":\"323 FIRST AVE S\",\"city\":\"SEATTLE\",\"state_code\":\"WA\",\"zip\":\"98104-0000\",\"id\":106,\"lat\":\"47.59933100\",\"lon\":\"-122.33452320\",\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/organizations/106_thumbnail_77b4b9d0f6dae13b.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3082_thumbnail_6838fffa310e4f8e.jpg\"}],\"description\":\"Chatwin Arts presents Shifting Light, a group exhibition featuring 12 contemporary Pacific Northwest painters. Through expressionist works, the artists explore seasonal, social, urban, and environmental change across the region. A free reception takes place September 3 from 5–9 p.m., with additional gallery visits available by appointment.\\r\\n\"},{\"id\":2715,\"name\":\"Tatsiana Mikhailava: Mountains to Meadows\",\"title\":\"$undefined\",\"start_date\":\"2026-09-03 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"queen_anne\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Fountainhead Gallery\",\"street\":\"625 W McGraw St\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98119\",\"id\":127,\"lat\":\"47.63945850\",\"lon\":\"-122.36610840\",\"neighborhood\":\"queen_anne\",\"main_photo\":\"/art/photos/organizations/127_thumbnail_70effbb4592ec101.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2715_thumbnail_51f36fcfec2b3902.jpg\"}],\"description\":\"Fountainhead Gallery will present Tatsiana Mikhailava’s oil paintings celebrating the beauty and spirit of Washington’s mountains, forests, and meadows. More information about the exhibition is coming soon, including details about the September 12 opening reception.\"},{\"id\":1617,\"name\":\"William Kentridge: Prints\",\"title\":\"$undefined\",\"start_date\":\"2026-09-03 00:00:00\",\"end_date\":\"2026-10-23 23:59:59\",\"event_type\":null,\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Greg Kucera Gallery\",\"street\":\"212 Third Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98104\",\"id\":112,\"lat\":\"47.60042190\",\"lon\":\"-122.32989200\",\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/organizations/112_thumbnail_0f8e689cb925a935.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1617_thumbnail_76752a6a25df8f3f.jpg\"}],\"description\":\"More information to come.\"},{\"id\":3084,\"name\":\"Gabrielle Wambaugh: Discontinuity\",\"title\":\"$undefined\",\"start_date\":\"2026-09-05 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"queen_anne\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Traver Gallery\",\"street\":\"1100 W. Ewing Street\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98119\",\"id\":125,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"queen_anne\",\"main_photo\":\"/art/photos/organizations/125_thumbnail_6a6ac5f524efa96f.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3084_thumbnail_2264178c3cecdb54.jpg\"}],\"description\":\"Traver Gallery presents Discontinuity, French sculptor Gabrielle Wambaugh’s debut exhibition at the Seattle gallery. Through ceramics and mixed media, Wambaugh explores the boundaries between abstraction and figuration, presence and absence. Admission is free, with an opening reception on September 5 from 3–5 p.m.\"},{\"id\":3518,\"name\":\"Guest Curator Program 2026\",\"title\":\"$undefined\",\"start_date\":\"2026-09-09 00:00:00\",\"end_date\":\"2027-02-28 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Museum of Pop Culture (MoPOP)\",\"street\":\"325 5th Ave N\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98109\",\"id\":279,\"lat\":\"47.62144660\",\"lon\":\"-122.34828290\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/279_thumbnail_1f058d7b8b00db60.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3518_thumbnail_33af90db566b9581.jpg\"}],\"description\":\"Whether they warn of post-apocalyptic ruin or imagine paths toward renewal, Eco-Blockbusters present environmental crisis as both spectacle and consequence. These films expose the costs of human hubris and exploitation, spark dialogue around current environmental issues, and warn that the futures on screen are not as distant as they seem.\"},{\"id\":3517,\"name\":\"Rebels + Icons: The Photography of Janette Beckman\",\"title\":\"$undefined\",\"start_date\":\"2026-09-09 00:00:00\",\"end_date\":\"2027-04-18 23:59:59\",\"event_type\":null,\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Museum of Pop Culture (MoPOP)\",\"street\":\"325 5th Ave N\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98109\",\"id\":279,\"lat\":\"47.62144660\",\"lon\":\"-122.34828290\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/279_thumbnail_1f058d7b8b00db60.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3517_thumbnail_5cf862ac3e99ba2b.jpg\"}],\"description\":\"Rebels + Icons: The Photography of Janette Beckman presents the most extensive collection of Beckman’s work to date, bringing together over four decades of photography that continue to define contemporary culture.\"},{\"id\":2440,\"name\":\"Much Ado About Nothing\",\"title\":\"$undefined\",\"start_date\":\"2026-09-10 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Music / Performance\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Theatre Puget Sound\",\"street\":\"The Armory 305 Harrison St\",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98109\",\"id\":1046,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2440_thumbnail_1d28f42567ec7b3e.jpg\"}],\"description\":\"Set in 1970s Seattle’s hottest gay nightclub, Messy Ina’s, this delightfully queer adaptation of Shakespeare’s Much Ado About Nothing brings drag, romance and comedy to the stage. Featuring drag king and queen chaos, lip-syncs, Muppet-style antics and plenty of puns, this vibrant reimagining celebrates love in all its messy glory.\"},{\"id\":3486,\"name\":\"Debra Baxter: Ascent\",\"title\":\"$undefined\",\"start_date\":\"2026-09-12 00:00:00\",\"end_date\":\"2026-10-03 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"belltown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Roq La Rue Gallery\",\"street\":\"117 W. Denny Way\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98121\",\"id\":192,\"lat\":\"47.62381530\",\"lon\":\"-122.29604770\",\"neighborhood\":\"belltown\",\"main_photo\":\"/art/photos/organizations/192_thumbnail_146e021586b1f57d.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3486_thumbnail_a19dbcb0bbf6a8fd.jpg\"}],\"description\":\"Santa Fe sculptor Debra Baxter presents Ascent, her third solo exhibition at Roq La Rue. Inspired by women mystics throughout history and Baxter’s own transformative experiences with long COVID, the show explores femininity, vulnerability, spiritual connection, and resilience. Sculptures made from alabaster, bronze, steel, and crystal portray women striving to maintain higher consciousness while fracturing and falling apart. \"},{\"id\":3056,\"name\":\"Ko Kirk Yamahira: The Threshold of Thought and Appearance\",\"title\":\"$undefined\",\"start_date\":\"2026-09-12 00:00:00\",\"end_date\":\"2026-10-10 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"georgetown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"studio e\",\"street\":\"609 South Brandon Street\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98108\",\"id\":99,\"lat\":\"47.55393160\",\"lon\":\"-122.32642830\",\"neighborhood\":\"georgetown\",\"main_photo\":\"/art/photos/organizations/99_thumbnail_4b6d7ded5f566b2d.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3056_thumbnail_10ae147595dbcafb.jpg\"}],\"description\":\"studio e presents The Threshold of Thought and Appearance, a main-gallery exhibition of new work by Ko Kirk Yamahira. Through the meticulous process of unthreading canvas, Yamahira transforms painting’s traditional support into the artwork itself. A large, C-shaped installation invites visitors inside an undulating enclosure of floating threads, surrounded by a series of smaller works. This free exhibition explores how dismantling familiar structures can create new forms and ways of seeing.\\r\\n\"},{\"id\":2452,\"name\":\"A Chorus Line\",\"title\":\"$undefined\",\"start_date\":\"2026-09-15 00:00:00\",\"end_date\":\"2026-09-27 23:59:59\",\"event_type\":\"Music / Performance\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"The 5th Avenue Theatre\",\"street\":\"1308 5th Ave\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"9811\",\"id\":163,\"lat\":\"47.60938750\",\"lon\":\"-122.33383790\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/163_thumbnail_87fbce56c5855731.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2452_thumbnail_9d124bb16e49c532.jpg\"}],\"description\":\"A Chorus Line returns to The 5th Avenue Theatre in a brand-new production running September 15–27, 2026. Featuring iconic songs, electrifying choreography and heartfelt storytelling, this Tony Award- and Pulitzer Prize-winning musical celebrates the passion, sacrifice and resilience behind the pursuit of a dancer’s dream.\"},{\"id\":2467,\"name\":\"Ragtime\",\"title\":\"$undefined\",\"start_date\":\"2026-09-15 00:00:00\",\"end_date\":\"2026-11-15 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Village Theatre\",\"street\":\"303 Front St N\",\"city\":\"Issaquah\",\"state_code\":\"WA\",\"zip\":\"98027\",\"id\":181,\"lat\":\"47.53310850\",\"lon\":\"-122.03688690\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/181_thumbnail_4eb18766720d6b28.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2467_thumbnail_9e666e11a1980630.jpg\"}],\"description\":\"Ragtime brings turn-of-the-century America to life through the stories of a Harlem musician, a Jewish immigrant, and a wealthy socialite seeking a better future. With a Tony Award-winning score blending jazz, blues, ragtime, and Broadway style, this powerful musical explores the hopes and challenges that shaped the nation. Please visit the website for detailed content advisories, including information about offensive language, violence, and other sensitive content.\"},{\"id\":3697,\"name\":\"Nouvelles Femmes: Modern Women of the of the 1960s French New Wave Cinema\",\"title\":\"$undefined\",\"start_date\":\"2026-09-16 00:00:00\",\"end_date\":\"2026-11-17 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"SIFF\",\"street\":\"167 Republican St. \",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98109\",\"id\":63,\"lat\":\"47.62304160\",\"lon\":\"-122.35324940\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/63_thumbnail_0db4f9391a43d76b.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3697_thumbnail_ed291227321da782.jpg\"}],\"description\":\"Celebrate the revolutionary spirit of the French New Wave, whose film-educated writer-directors transformed cinema through bold experimentation, personal freedom, and rebellion. Featuring works by Jean-Luc Godard, François Truffaut, Éric Rohmer, and trailblazing writer-director Agnès Varda, the series highlights unforgettable performances by Jeanne Moreau, Anna Karina, Jean-Paul Belmondo, Jean Seberg, and many others. Brimming with lyrical imagery, existential wit, Parisian cool, and liberated visions of love and identity, these films capture the exhilaration of living in the moment. Their daring themes and stylistic innovations continue to inspire filmmakers and shape the future of cinema.\"},{\"id\":2441,\"name\":\"Clayton Lee - The Goldberg Variations\",\"title\":\"$undefined\",\"start_date\":\"2026-09-17 00:00:00\",\"end_date\":\"2026-09-19 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"On the Boards\",\"street\":\"100 W Roy St.\",\"city\":\"Seattle\",\"state_code\":\"Wa\",\"zip\":\"98119\",\"id\":218,\"lat\":\"47.62593410\",\"lon\":\"-122.35821230\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/218_thumbnail_180636e527a67f5c.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2441_thumbnail_201fd42527d29c55.jpg\"}],\"description\":\"Clayton Lee’s bold and deeply personal performance explores queer sexuality, desire, power dynamics and vulnerability through an unexpected blend of classical music, professional wrestling and personal storytelling. With sharp humor and emotional honesty, Lee examines fantasy, identity and the complexities of intimacy in this unconventional theatrical experience.\"},{\"id\":3132,\"name\":\"Art \u0026 Steel Art Exhibition\",\"title\":\"$undefined\",\"start_date\":\"2026-09-18 00:00:00\",\"end_date\":\"2026-09-18 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"georgetown\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Gage Academy of Art\",\"street\":\"6520 5th Ave S, Seattle, WA 98108\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98102\",\"id\":144,\"lat\":\"47.54482530\",\"lon\":\"-122.32806930\",\"neighborhood\":\"georgetown\",\"main_photo\":\"/art/photos/organizations/144_thumbnail_96a114e0516c0449.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3132_thumbnail_1efd2823a65b882e.jpg\"}],\"description\":\"Art \u0026 Steel opens in West Seattle, bringing together artistic creativity, industrial heritage, and community engagement. The group exhibition explores steel as both a material and a metaphor through works in a variety of mediums. Featured artist Flora Ling, a longtime Gage Academy student, presents two pieces in the show. Proceeds from art sales will support arts education programs for future generations.\"},{\"id\":2859,\"name\":\"MUSIC SOIRÉE — with Efe Baltacigil and Valerie Muzzolini from Seattle Symphony\",\"title\":\"$undefined\",\"start_date\":\"2026-09-18 00:00:00\",\"end_date\":\"2026-09-18 23:59:59\",\"event_type\":\"Internal Event\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Conru Foundation\",\"street\":\"110 Union Street, Suite 400\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98121\",\"id\":1,\"lat\":\"47.60782530\",\"lon\":\"-122.33911480\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/1_thumbnail_14851f2f20333e70.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2859_thumbnail_8414cf8dde258a03.jpg\"}],\"description\":\"Join us for a special evening with Efe Baltacigil, Principal Cellist of the Seattle Symphony, and Valerie Muzzolini, Principal Harpist of the Seattle Symphony, as they come together for an intimate evening of music.\\r\\n\\r\\nMusic Soirée is a monthly offering at ArtLove Salon—an intimate, seated music experience shaped by the warmth of live performance.\\r\\n\\r\\nSet within the galleries of ArtLove Salon, the evening invites guests to slow down and settle into a shared listening experience surrounded by art, conversation, and the lingering light of early summer.\\r\\n\\r\\n✨ Friday, September 18th.  Doors \u0026 Reception: 5:00 PM Performance: 5:15PM –6:15 PM Post-Concert Reception: 6:15 PM–7:00 PM\\r\\n\\r\\nFree with RSVP. Light refreshments provided.\"},{\"id\":3174,\"name\":\"Neighborhood Open House Featuring The Pearl String Quartet\",\"title\":\"$undefined\",\"start_date\":\"2026-09-18 00:00:00\",\"end_date\":\"2026-09-18 23:59:59\",\"event_type\":\"Opening\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3174_thumbnail_ba4294447a31d1ad.jpg\"}],\"description\":\"The Team at Occidental Fine Arts Center invites you see our space, mingle, and enjoy music by The Pearl String Quartet.  We look forward to meeting you \u0026 showing you what's new.\"},{\"id\":1267,\"name\":\"Art \u0026 Culture Week 2026\",\"title\":\"$undefined\",\"start_date\":\"2026-09-19 00:00:00\",\"end_date\":\"2026-09-26 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\":\"110 Union Street, 5th floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":462,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/462_thumbnail_2053695641081a34.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1267_thumbnail_491b5a7277aae674.jpg\"}],\"description\":\"As part of Seattle’s annual Art + Culture Week, our venue will serve as one of the city’s most dynamic hubs for programming—bringing together a full week of events that reflect the distinct and diverse creative communities shaping Seattle.\\r\\n\\r\\nThe program brings together a cross-section of practices spanning contemporary art, performance, music, fashion, literature, and experimental media, with an emphasis on dialogue, exchange, and new work. Expect exhibitions, live performances, artist-led workshops, conversations, readings, and late-night gatherings that reflect the energy and complexity of Seattle’s creative communities.\\r\\n\\r\\nFor those tracking what’s happening across the city, this will be one of the most active and compelling spaces to spend time. Full program to be announced.\\r\\n\\r\\n\"},{\"id\":2455,\"name\":\"Arts Connect: Accessing Learning through the Arts\",\"title\":\"$undefined\",\"start_date\":\"2026-09-19 00:00:00\",\"end_date\":\"2026-09-20 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Arts Impact\",\"street\":\"4052 SW College St\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98116\",\"id\":17,\"lat\":\"47.58363770\",\"lon\":\"-122.38296380\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/17_thumbnail_e2df51c060f9f1fd.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2455_thumbnail_fad3512ba52b66eb.jpg\"}],\"description\":\"Note: This is a private event.\\r\\n\\r\\nTwo-day training for teaching artists interested in deepening their skills in culturally responsive arts integrated teaching\\r\\nand lesson development\"},{\"id\":3040,\"name\":\"August Baik: Classical Solo Piano\",\"title\":\"$undefined\",\"start_date\":\"2026-09-19 00:00:00\",\"end_date\":\"2026-09-19 23:59:59\",\"event_type\":\"Music\",\"neighborhood\":\"queen_anne\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Fountainhead Gallery\",\"street\":\"625 W McGraw St\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98119\",\"id\":127,\"lat\":\"47.63945850\",\"lon\":\"-122.36610840\",\"neighborhood\":\"queen_anne\",\"main_photo\":\"/art/photos/organizations/127_thumbnail_70effbb4592ec101.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3040_thumbnail_6f859184de5a0d04.jpg\"}],\"description\":\"Seattle-born pianist August Baik returns to Fountainhead Gallery for his fourth solo recital. The 20-year-old performer, composer, and collaborator studies with Stephen Drury at the New England Conservatory of Music. Baik has appeared with orchestras in Boston and Seattle and participated in renowned programs, including the Tanglewood Music Festival. Tickets are available for this intimate concert combining classical music with the gallery’s visual-art setting.\\r\\n\"},{\"id\":3184,\"name\":\"Élégance Soirée\",\"title\":\"$undefined\",\"start_date\":\"2026-09-19 00:00:00\",\"end_date\":\"2026-09-19 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Conru Foundation\",\"street\":\"110 Union Street, Suite 400\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98121\",\"id\":1,\"lat\":\"47.60782530\",\"lon\":\"-122.33911480\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/1_thumbnail_14851f2f20333e70.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3184_thumbnail_886d4f63af4c1d20.jpg\"}],\"description\":\"Note: This is a partner event. Visit URL for ticket purchase.\\r\\n\\r\\n\\\"A classy night of rhythm \u0026 romance.\\\"\\r\\n\\r\\nÉlégance Soirée is back for a new edition.\\r\\n\\r\\nExpect the elegance you know and love—dress your best, connect and dance. Sip, socialize, and move to smooth Rumba, Kizomba, Zouk, Kompa, and R\u0026B grooves.\\r\\n\\r\\nWhether you come for the the music, or the company, Élégance Soirée x The Wine \u0026 Whine Series invites you to dress elevated, sip intentionally, and lose yourself in a night of passion, and rhythm — a celebration of taste, culture, and romance that never goes out of style.\\r\\n\\r\\n\"},{\"id\":2558,\"name\":\"JLF Seattle 2026: A Celebration of Literature\",\"title\":\"$undefined\",\"start_date\":\"2026-09-19 00:00:00\",\"end_date\":\"2026-09-20 23:59:59\",\"event_type\":\"Literature\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Town Hall Seattle\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":594,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2558_thumbnail_7fc9805224c4eff7.jpg\"}],\"description\":\"JLF Seattle returns for its third edition, bringing the celebrated Jaipur Literature Festival to the Pacific Northwest. Enjoy two days of thought-provoking conversations with acclaimed authors, thinkers, and cultural voices from around the world. Explore literature, history, technology, politics, and more through a dynamic lineup of sessions and performances.\"},{\"id\":3171,\"name\":\"Live Music: Dxvincenzo - Cello \u0026 Soundscapes\",\"title\":\"$undefined\",\"start_date\":\"2026-09-19 00:00:00\",\"end_date\":\"2026-09-19 23:59:59\",\"event_type\":\"Performance\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3171_thumbnail_6d218de9f4d27efb.jpg\"}],\"description\":\"Occidental Fine Arts Center welcomes Dxvincenzo to Occidental Square.  Enjoy immersive live soundscapes built from cello, voice, and looping. Blending classical textures with lo-fi grooves and modern pop influences, he creates songs in real time—transforming a single instrument into a layered, cinematic experience.\\r\\n\\r\\nJoin us as Dxvincenzo fills the gallery with rich, evolving sound— a perfect pause surrounded by art, music, and community.\"},{\"id\":3104,\"name\":\"THE RAHK DANCE THEATRE: DREAMLAND\",\"title\":\"$undefined\",\"start_date\":\"2026-09-19 00:00:00\",\"end_date\":\"2026-09-19 23:59:59\",\"event_type\":null,\"neighborhood\":null,\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Langston\",\"street\":\"104 17th Ave S. \",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98144\",\"id\":62,\"lat\":\"47.60133850\",\"lon\":\"-122.30984700\",\"neighborhood\":null,\"main_photo\":\"/art/photos/organizations/62_thumbnail_fb81d807b576dfc6.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3104_thumbnail_87ef6083afb3b7f9.jpg\"}],\"description\":\"Rahk Dance Theatre’s Dreamland follows a young New York City dancer pursuing her ambition of joining a major dance company. Blending the energy of hip-hop, the elegance of contemporary ballet, and the wonder of illusion, the production brings her imaginative journey to life. This inspiring performance celebrates artistic expression, perseverance, and the limitless power of dreams.\\r\\n\"},{\"id\":3053,\"name\":\"Writing's on the Wall: An Open Mic on Memorializing\",\"title\":\"$undefined\",\"start_date\":\"2026-09-19 00:00:00\",\"end_date\":\"2026-09-19 23:59:59\",\"event_type\":\"Literature\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Museum of Northwest Art \",\"street\":\"121 South First Street \",\"city\":\"La Conner\",\"state_code\":\"WA\",\"zip\":\"98257\",\"id\":305,\"lat\":\"48.38871420\",\"lon\":\"-122.49627520\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3053_thumbnail_ff1101401ceecfa4.jpg\"}],\"description\":\"Local poets gather in the museum galleries for an open mic celebrating the closing of Ross Palmer Beecher: Speaking in the Vernacular. Centered on the theme of memorializing, the event connects original poetry with Beecher’s explorations of cultural memory and vernacular expression. Performances unfold among the artworks, creating a dynamic conversation between literary and visual art. Community members are invited to participate and celebrate the power of local creative voices.\\r\\n\"},{\"id\":3102,\"name\":\"ART \u0026 CULTURE WEEK:  O-Jak 2025 Watch Party \u0026 2026 Festival Preview + MMDC Live Performance\",\"title\":\"$undefined\",\"start_date\":\"2026-09-20 00:00:00\",\"end_date\":\"2026-09-20 23:59:59\",\"event_type\":\"Internal Event\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Conru Foundation\",\"street\":\"110 Union Street, Suite 400\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98121\",\"id\":1,\"lat\":\"47.60782530\",\"lon\":\"-122.33911480\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/1_thumbnail_14851f2f20333e70.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3102_thumbnail_000bcda58717d109.jpg\"}],\"description\":\"Join Margolis Arts Foundation for a special afternoon celebrating the past, present, and future of\\r\\nthe O-Jak Bridge Art \u0026 Dance Festival.\\r\\n\\r\\nThe program will feature a watch party highlighting performances from the 2025 O-Jak Bridge Art\\r\\n\u0026 Dance Festival, along with live dance performances by MiYoung Margolis Dance Collective\\r\\n(MMDC).\\r\\nWe will also introduce and promote the upcoming 2026 O-Jak Bridge Art \u0026 \\r\\n\\r\\nDance Festival: Once Upon a Time, taking place November 14–15, 2026 at Broadway Performance\\r\\nHall in Seattle. Guests will have an opportunity to learn more about this year’s artistic vision,\\r\\nparticipating artists and organizations, and the cultural stories and collaborations that will shape the\\r\\n2026 festival.\\r\\nThrough film, live performance, conversation, and a preview of the upcoming festival, the afternoon\\r\\nwill give audiences an opportunity to experience the continuing evolution of O-Jak and connect\\r\\nmore closely with the artists and community behind it.\"},{\"id\":1328,\"name\":\"Weekly Tai Chi \u0026 Qigong in the Park                 \",\"title\":\"$undefined\",\"start_date\":\"2026-09-22 00:00:00\",\"end_date\":\"2026-09-22 23:59:59\",\"event_type\":null,\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Art Love Salon\",\"street\":\"110 Union Street, 5th floor\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"\",\"id\":462,\"lat\":\"47.60818940\",\"lon\":\"-122.33886930\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/462_thumbnail_2053695641081a34.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/1328_thumbnail_d5f4ecb47e3bde50.jpg\"}],\"description\":\"Mindful Movement at Art Love Salon\\r\\n\\r\\nArt Love Salon is proud to sponsor this weekly mindful movement session inspired by Tai Chi and Qigong.\\r\\n\\r\\nJoin us each Tuesday at Art Love Salon for a gentle, beginner-friendly practice led by instructor Karin Philomin. The session incorporates simple Tai Chi and Qigong-inspired movements designed to support posture, balance, breath, relaxation, and a greater sense of calm.\\r\\n\\r\\nWhether you are new to Tai Chi or already familiar with the practice, everyone is welcome. The session offers an opportunity to slow down, reconnect with the body, and enjoy mindful movement in a welcoming indoor setting.\\r\\n\\r\\nWhen: Tuesdays, 12:00–1:00 PM\\r\\n\\r\\nWhere:\\r\\nArt Love Salon\\r\\n110 Union St, 5th Floor\\r\\nSeattle, WA\\r\\n\\r\\nWhat to Expect:\\r\\nA gentle Tai Chi and Qigong-inspired practice focusing on posture, balance, breathing, and simple flowing movements. The session is suitable for beginners and can be adapted to individual comfort levels.\\r\\n\\r\\nCome move, breathe, and reset with us at Art Love Salon!\"},{\"id\":2896,\"name\":\"ART \u0026 CULTURE WEEK:  An Evening of Vocal Stylings with Adé \",\"title\":\"$undefined\",\"start_date\":\"2026-09-23 00:00:00\",\"end_date\":\"2026-09-23 23:59:59\",\"event_type\":\"Internal Event\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Conru Foundation\",\"street\":\"110 Union Street, Suite 400\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98121\",\"id\":1,\"lat\":\"47.60782530\",\"lon\":\"-122.33911480\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/1_thumbnail_14851f2f20333e70.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2896_thumbnail_517d9b9d12d09b8f.jpg\"}],\"description\":\"Singer, songwriter, actor, model and a beloved fixture of Seattle's arts and queer nightlife scene — Adé A Cônnére brings soulful vocals to the Art Love Salon. Adé will be accompanied by the incredibly talented local jazz pop-artist Noah Goldberg.\"},{\"id\":2082,\"name\":\"Introduction to Alternative Process Photography\",\"title\":\"$undefined\",\"start_date\":\"2026-09-23 00:00:00\",\"end_date\":\"2026-12-02 23:59:59\",\"event_type\":\"Workshop\",\"neighborhood\":\"capitol_hill\",\"is_pda\":0,\"site_id\":1,\"org\":{\"name\":\"Photographic Center Northwest \",\"street\":\"900 12th Ave \",\"city\":\"Seattle \",\"state_code\":\"WA\",\"zip\":\"98122\",\"id\":52,\"lat\":\"47.61055230\",\"lon\":\"-122.31643240\",\"neighborhood\":\"capitol_hill\",\"main_photo\":\"/art/photos/organizations/52_thumbnail_d36c4bcb5792a72b.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2082_thumbnail_7826304142527f55.jpg\"}],\"description\":\"$1d\"},{\"id\":3686,\"name\":\"Live Music:  Lirico Spinto Soprano Sarah Fletcher\",\"title\":\"$undefined\",\"start_date\":\"2026-09-23 00:00:00\",\"end_date\":\"2026-09-23 23:59:59\",\"event_type\":\"Performance\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3686_thumbnail_381d99134c109a98.jpg\"}],\"description\":\"Lirico spinto soprano Sarah Fletcher is a powerhouse performer and driving force in the Pacific Northwest arts scene. A board member for Puget Sound Concert Opera and Opera On Tap, as well as a veteran of the Seattle Opera Chorus, she blends high-caliber vocal versatility with active arts leadership. Her recent endeavors include producing and starring in the premiere opera performance La Callas at Art Love Salon and singing at their opening gala. Currently, Fletcher is on stage as Waltraute (and covering Sieglinde) in Tacoma Opera’s monumental Die Walküre, before taking on the fiery title role of Abigaille in Nabucco with Puget Sound Concert Opera this November.\\r\\nShe is thrilled to bring her voice to the Occidental Fine Arts Center for Seattle Arts and Culture Week on September 23rd (4:00 PM- 6:00 PM at 311 Occidental Ave S).\"},{\"id\":2194,\"name\":\"Salon Studio Series: Charcoal Drawing with Garima Tripathi \",\"title\":\"$undefined\",\"start_date\":\"2026-09-23 00:00:00\",\"end_date\":\"2026-09-23 23:59:59\",\"event_type\":\"Workshop: Art\",\"neighborhood\":\"\",\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Conru Foundation\",\"street\":\"110 Union Street, Suite 400\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98121\",\"id\":1,\"lat\":\"47.60782530\",\"lon\":\"-122.33911480\",\"neighborhood\":\"\",\"main_photo\":\"/art/photos/organizations/1_thumbnail_14851f2f20333e70.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2194_thumbnail_66e7d3a972eff3c4.jpg\"}],\"description\":\"$1e\"},{\"id\":2460,\"name\":\"ART \u0026 CULTURE WEEK:  The Art of Collaboration:  A conversation with Tracey Conway and Nancy Guppy \",\"title\":\"$undefined\",\"start_date\":\"2026-09-24 00:00:00\",\"end_date\":\"2026-09-24 23:59:59\",\"event_type\":\"Partner Event\",\"neighborhood\":null,\"is_pda\":0,\"site_id\":2,\"org\":{\"name\":\"Friends of Art Zone\",\"street\":null,\"city\":null,\"state_code\":null,\"zip\":null,\"id\":559,\"lat\":null,\"lon\":null,\"neighborhood\":null,\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/2460_thumbnail_8c2c860ae639ac93.jpg\"}],\"description\":\"What was it like creating Almost Live!? Join Tracey Conway and Nancy Guppy for a lively conversation about their decade working together as cast members on the legendary KING TV sketch comedy show. They’ll present classic video clips and share behind-the-scene
