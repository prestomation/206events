<!doctype html><html><head><title>PublicDisplay.ART Calendar</title></head><body><div id="__next"></div><script>self.__next_f = self.__next_f || []; self.__next_f.push([1,"5:{\"initialEvents\":[{\"id\":3698,\"name\":\"FIRST THURSDAY ART WALK: Taz & Jazz at Occidental Fine Arts Center\",\"title\":\"$undefined\",\"start_date\":\"2026-10-01 00:00:00\",\"end_date\":\"2026-10-01 23:59:59\",\"event_type\":\"Performance\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3698_thumbnail_6571032b3f6d831c.jpg\"}],\"description\":\"Join us for October's Pioneer Square First Thursday Art Walk!\\r\\nFIRST FLOOR:\\r\\nD'Vonne Lewis Trio\\r\\nFeaturing: D'Vonne Lewis (Drums), Julio Juaregui (pianist), and Dean Schmidt (bass)\\r\\nTaz Matcha\\r\\nMEZZANINE:\\r\\nArtist Led Life Drawing\\r\\nSECOND FLOOR:\\r\\nBeautiful Things Exhibit\\r\\nGallery featuring works by Seattle Prize Fellows\"},{\"id\":3851,\"name\":\"SECOND THURSDAY:  Live Music Lunch Hour with The Jacob Zimmerman 3\",\"title\":\"$undefined\",\"start_date\":\"2026-10-08 00:00:00\",\"end_date\":\"2026-10-08 23:59:59\",\"event_type\":\"Performance\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3851_thumbnail_0e9cb7d54f30eace.jpg\"}],\"description\":\"Occidental Fine Arts Center presents The Jacob Zimmerman 3 (Jacob Zimmerman — saxophone, Matt Weiner — bass, Chris Spencer, guitar).\\r\\n\\r\\nBring your lunch & your appetite for some tasty jazz!\"},{\"id\":3661,\"name\":\"A Conversation with Seattle Author and Director David Norman Lewis\",\"title\":\"$undefined\",\"start_date\":\"2026-10-10 00:00:00\",\"end_date\":\"2026-10-10 23:59:59\",\"event_type\":\"Talk\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3661_thumbnail_6abd1f3b049f87e4.jpg\"}],\"description\":\"Join us for a viewing & discussion of \\\"The Burning of Moses Seattle,\\\" a documentary about Chief Seattle's grandson, directed by Seattle author David Norman Lewis.\"},{\"id\":3687,\"name\":\"THIRD THURSDAY: Life Drawing Session\",\"title\":\"$undefined\",\"start_date\":\"2026-10-15 00:00:00\",\"end_date\":\"2026-10-15 23:59:59\",\"event_type\":\"Workshop\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3687_thumbnail_cb5f5311f49d5680.jpg\"}],\"description\":\"Join us for Third Thursday Life Drawing, a new Occidental Fine Arts initiative offering local artists the opportunity to draw and paint from a live model for FREE. Sessions feature a variety of models, poses, and attire, and artists of all styles and experience levels are welcome.\\r\\n\\r\\nApply online to participate. If accepted, there is no cost to attend, and basic art materials will be provided. Artists are also encouraged to bring their own materials so they can work in their preferred medium and style.\"},{\"id\":3695,\"name\":\"Live Jazz:  José Gonzales Trio\",\"title\":\"$undefined\",\"start_date\":\"2026-10-22 00:00:00\",\"end_date\":\"2026-10-22 23:59:59\",\"event_type\":\"Performance\",\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3695_thumbnail_f42defed45dd3e28.jpg\"}],\"description\":\"Join The Occidental Fine Arts Center in welcoming the José Gonzales Trio for an afternoon of jazz.\\r\\n\\r\\nJosé “Juicy” Gonzales\\r\\n\\r\\nRooted in jazz, fueled by the blues, and marinated in funk, pianist and singer José “Juicy” Gonzales delivers a rich, dynamic musical experience.\\r\\n\\r\\nJuicy has performed throughout Germany, New York, California, Seattle, and Oregon, and has been featured on radio, including BBC Radio 2’s The Swing & Big Band Show with Clare Teal. His fresh sound is informed by classic jazz of the ’50s and ’60s—including Monk, Oscar Peterson, Bill Evans, and Miles Davis—as well as pop icons such as Elton John, The Beatles, Prince, and more.\\r\\n\\r\\nFor the holidays, his trio performs Vince Guaraldi’s A Charlie Brown Christmas live, with Juicy sharing stories about the making of the beloved special. For the past 15 years, the show has sold out one of Seattle’s largest venues.\\r\\n\\r\\nThe trio is comprised of José “Juicy” Gonzales on piano, Michael Glynn on bass, and Matt Jorgensen on drums.\"},{\"id\":3699,\"name\":\"🎃Yoga with Nancy Nomellini from Mother Yoga Studio👻\",\"title\":\"$undefined\",\"start_date\":\"2026-10-24 00:00:00\",\"end_date\":\"2026-10-24 23:59:59\",\"event_type\":null,\"neighborhood\":\"pioneer_square\",\"is_pda\":0,\"site_id\":4,\"org\":{\"name\":\"Occidental Fine Arts Center\",\"street\":\"311 1/2 Occidental Ave South\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":null,\"id\":774,\"lat\":null,\"lon\":null,\"neighborhood\":\"pioneer_square\",\"main_photo\":\"/art/photos/default/photo_icon_portrait.png\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/3699_thumbnail_dc2ff912c165e719.jpg\"}],\"description\":\"🕷️Join us on the Mezzanine for a complimentary 1 hour & 15 minute spooky good yoga session led by Nancy Nomellini, founder of Mother Yoga Studio. \\r\\n\\r\\nAll levels welcome!\\r\\n\\r\\nPlease bring your own yoga mat and water.  Costumes encouraged!🎃\"},{\"id\":479,\"name\":\"Never Turn Back: Echoes of African American Music\",\"title\":\"$undefined\",\"start_date\":\"2025-05-17 00:00:00\",\"end_date\":\"2027-01-17 00:00:00\",\"event_type\":\"Art\",\"neighborhood\":\"downtown\",\"is_pda\":0,\"site_id\":null,\"org\":{\"name\":\"Museum of Pop Culture (MoPOP)\",\"street\":\"325 5th Ave N\",\"city\":\"Seattle\",\"state_code\":\"WA\",\"zip\":\"98109\",\"id\":279,\"lat\":\"47.62144660\",\"lon\":\"-122.34828290\",\"neighborhood\":\"downtown\",\"main_photo\":\"/art/photos/organizations/279_thumbnail_1f058d7b8b00db60.jpg\"},\"photos\":[{\"thumbnail\":\"https://artlove.org/art/photos/events/479_thumbnail_3c2a40f919a7dd00.jpg\"}],\"description\":\"Never Turn Back: Echoes of African American Music unveils the profound legacy of Gospel, Blues, Jazz, and Soul artists who shaped the soundscape of American culture and used their music as instruments of resistance, identity, and representation.  \"},{\"id\":1188,\"name\":\"Jonathan Lasker: Drawings and Studies\",\"title\":\"$undefined\",\"start_date\":\"2026-03-01 00:00:00\",\"end_date\":\"2026-10-11 23:59:59\",\"event_type\":\"Art\",\"neighborhood\":\"
