  - Fremont
schedules:
  - schedule: every Monday
    start_time: "22:00"
    duration: PT2H
  - schedule: every Thursday
    start_time: "22:00"
    duration: PT2H
  - schedule: every Friday
    start_time: "22:15"
    duration: PT2H45M
  # Site copy says "Most Saturdays" rather than "Every Saturday" (skipped on
  # rare weeks, e.g. venue closures) — modeled as weekly since the studio
  # advertises it as their standing Saturday slot.
  - schedule: every Saturday
    start_time: "21:00"
    duration: PT3H
