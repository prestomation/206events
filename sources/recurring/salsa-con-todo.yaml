# Cover charges differ per social ($10 Mon/Thu, $15 Fri/Sat) — the recurring
# schema's `cost` field is a single flat value applied to every schedule
# entry in the file (see recurringEventSchema in lib/config/recurring.ts),
# so a per-entry cost can't be represented structurally here. Noted in prose
# instead of a structured (and misleading, if applied uniformly) cost field.
description: Weekly Latin dance socials at Salsa Con Todo, a dance studio in Fremont — Monday Brazilian Zouk ($10), Thursday Westie Lab ($10), Friday salsa/bachata/zouk/kizomba ($15), and Saturday swing ($15).
timezone: America/Los_Angeles
location: "211 N 36th St, Seattle, WA 98103"
url: https://www.salsacontodo.com/drop-ins
tags:
