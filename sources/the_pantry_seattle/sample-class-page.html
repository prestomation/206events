<!-- Trimmed excerpt of a thepantryseattle.com class page (Craft CMS), kept to
     just the markup extractClassHeroImage() targets: the hero photo lives in
     a `<figure class="image is-5by3 …">` that always precedes any instructor
     headshot (`<figure class="image is-square">`). See ripper.ts. -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta property="og:image" content="" />
</head>
<body>
  <main>
    <section class="section has-background-sand class-details">
      <div class="container">
        <div class="columns is-mobile is-multiline is-centered">
          <div class="column img_gallery is-four-fifths-mobile is-half-tablet">
            <figure class="image is-5by3 mb-0">
              <img src="https://the-pantry-prod.imgix.net/tomatoes_2022-09-16-205414_vtlf.jpg?ar=1.6666666666667&amp;fit=crop&amp;fm=webp&amp;fp-x=0.5&amp;fp-y=0.5&amp;ixlib=php-2.1.1&amp;q=50&amp;w=1244" />
            </figure>
          </div>
          <div class="column">
            <figure class="image is-square">
              <img src="https://the-pantry-prod.imgix.net/Stefan-Headshot.png?ar=1&amp;fit=crop&amp;fp-x=0.5&amp;fp-y=0.5&amp;ixlib=php-2.1.1&amp;w=60" />
            </figure>
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
