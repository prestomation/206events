# Seasonal haunted house (late Sep - early Nov). Open nights come from the
# public hytix.com (fearticket.com) dates API. The event id (5441 =
# "Georgetown Morgue 2026") is per-season: when a new season goes on sale at
# https://seattlehaunts.fearticket.com/, update the id in `url` (visible in the
# page's embedded "myEvent" data). Off-season the calendar is legitimately empty.
name: georgetown-morgue
sourceRole: venue
description: "Georgetown Morgue"
url: "https://api2.hytix.com/v2/public/events/5441/dates"
friendlyLink: https://seattlehaunts.com/schedule-and-events/
tags: ["Halloween", "Georgetown"]
geo:
  lat: 47.5572653
  lng: -122.3383505
  label: "Georgetown Morgue, 5000 E Marginal Way S, Seattle, WA 98134"
  # Nominatim's node at this address is tagged "Hudson" (a different named
  # tenant, 16m away) rather than "Georgetown Morgue" itself — same
  # multi-tenant building, same precedent as other reused-node entries in
  # lib/geocoder.ts (e.g. "tango-experts studio").
  osmType: node
  osmId: 2349883332
imageUrl: "https://seattlehaunts.com/wp-content/uploads/2020/09/MorgueGallery.jpg"
# Every "event" is the same haunted house on a different open night (the
# hytix dates API has no per-date image) — the venue photo above is the
# intended image for every night.
skipEventPhotos: true
calendars:
  - name: haunted-house
    friendlyname: "Georgetown Morgue Haunted House"
    timezone: America/Los_Angeles
